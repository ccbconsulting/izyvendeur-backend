<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#14213d" />
<meta name="robots" content="noindex, nofollow" />
<link rel="manifest" href="/caisse.webmanifest" />
<link rel="icon" type="image/png" href="/caisse-icon-192.png" />
<link rel="apple-touch-icon" href="/caisse-icon-192.png" />
<title>IzyVendeur Caisse</title>
<style>
  :root { --marine: #14213d; --vert: #1f7a4d; --vert-clair: #e6f4ec; --gris: #6b7280; --bord: #d9dee7; --fond: #f3f5f9; --rouge: #b42318; --rouge-clair: #fdecea; --orange: #b54708; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--fond); color: #1b2333; font-size: 16px; }
  button { font: inherit; cursor: pointer; border-radius: 8px; border: 1px solid var(--bord); background: #fff; color: var(--marine); padding: 10px 14px; min-height: 44px; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  button.principal { background: var(--marine); color: #fff; border-color: var(--marine); }
  button.vert { background: var(--vert); color: #fff; border-color: var(--vert); }
  button.danger { color: var(--rouge); }
  input, select, textarea { font: inherit; padding: 10px 12px; border: 1px solid var(--bord); border-radius: 8px; background: #fff; width: 100%; min-height: 44px; }
  label { display: block; font-size: .85em; color: var(--gris); margin: 10px 0 4px; }
  h1, h2, h3 { margin: 0 0 8px; color: var(--marine); }
  .cache { display: none !important; }
  #btnHL.hors { background: #b45309 !important; border-color: #fbbf24 !important; font-weight: 700; }
  #bandeauHL { background: #fef3c7; color: #92400e; padding: 6px 12px; font-size: .85em; border-bottom: 1px solid #fcd34d; }
  .raison { color: var(--gris); font-size: .88em; }

  /* ecrans plein cadre : connexion, ouverture, cloture */
  .ecran { max-width: 520px; margin: 0 auto; padding: 24px 16px 40px; }
  .carte { background: #fff; border: 1px solid var(--bord); border-radius: 12px; padding: 18px; }
  .logo-titre { text-align: center; margin: 12px 0 18px; }
  .logo-titre img { width: 64px; height: 64px; border-radius: 14px; }
  #erreurGlobale { position: fixed; left: 50%; transform: translateX(-50%); top: 10px; z-index: 50; max-width: 92vw; background: var(--rouge-clair); color: var(--rouge); border: 1px solid #f3b8b1; padding: 10px 16px; border-radius: 10px; box-shadow: 0 4px 14px rgba(0,0,0,.12); }
  #infoGlobale { position: fixed; left: 50%; transform: translateX(-50%); top: 10px; z-index: 50; max-width: 92vw; background: var(--vert-clair); color: var(--vert); border: 1px solid #b7dfc8; padding: 10px 16px; border-radius: 10px; }

  /* billetage */
  table.billetage { width: 100%; border-collapse: collapse; }
  table.billetage td { padding: 4px 6px; border-bottom: 1px solid var(--bord); }
  table.billetage input { width: 90px; text-align: right; }

  /* ecran de vente */
  #vente { display: flex; flex-direction: column; height: 100vh; height: 100dvh; }
  .barre { display: flex; align-items: center; gap: 8px; background: var(--marine); color: #fff; padding: 8px 12px; padding-top: max(8px, env(safe-area-inset-top)); flex-wrap: wrap; }
  .barre .nom { font-weight: 700; margin-right: auto; }
  .barre .sous { font-size: .8em; opacity: .8; font-weight: 400; display: block; }
  .barre button { background: rgba(255,255,255,.12); color: #fff; border-color: rgba(255,255,255,.25); min-height: 38px; padding: 6px 10px; font-size: .9em; }
  .barre a { color: #fff; font-size: .9em; text-decoration: underline; opacity: .85; }
  .corps { flex: 1; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 0; min-height: 0; }
  .gauche, .droite { display: flex; flex-direction: column; min-height: 0; min-width: 0; }
  .gauche { padding: 10px; border-right: 1px solid var(--bord); }
  .droite { background: #fff; padding: 10px; }
  #recherche { font-size: 1.05em; }
  #barreCat { display: flex; gap: 6px; overflow-x: auto; margin-top: 8px; padding-bottom: 2px; flex-shrink: 0; }
  #barreCat:empty { display: none; }
  #barreCat button { white-space: nowrap; min-height: 38px; padding: 4px 14px; border-radius: 19px; background: #fff; border: 1px solid var(--bord); font-weight: 600; flex-shrink: 0; }
  #barreCat button.actif { background: var(--marine); color: #fff; border-color: var(--marine); }
  .tuile .ph { width: 100%; height: 72px; object-fit: cover; border-radius: 6px; background: #eef1f5; margin-bottom: 2px; }
  #listeArticles { flex: 1; overflow: auto; margin-top: 8px; display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; align-content: start; grid-auto-rows: max-content; padding-bottom: 8px; }
  .tuile { background: #fff; border: 1px solid var(--bord); border-radius: 10px; padding: 10px; text-align: left; display: flex; flex-direction: column; gap: 4px; min-height: 84px; }
  .tuile .n { font-weight: 600; line-height: 1.2; }
  .tuile .p { color: var(--vert); font-weight: 700; }
  .tuile .s { color: var(--gris); font-size: .8em; margin-top: auto; }
  .tuile.rupture { opacity: .45; }
  #lignesPanier { flex: 1; overflow: auto; }
  .lp { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 8px 0; border-bottom: 1px solid var(--bord); }
  .lp .t { font-weight: 600; }
  .lp .m { text-align: right; font-weight: 700; }
  .lp .q { display: flex; align-items: center; gap: 4px; }
  .lp .q button { min-height: 36px; min-width: 36px; padding: 0; }
  .lp .q input { width: 74px; min-height: 36px; text-align: center; padding: 4px; }
  .gros { color: var(--orange); font-size: .8em; }
  .totaux { border-top: 2px solid var(--marine); padding-top: 8px; margin-top: 6px; }
  .totaux .l { display: flex; justify-content: space-between; }
  .totaux .grand { font-size: 1.5em; font-weight: 800; color: var(--marine); }
  .actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 8px; }
  .actions .payer { grid-column: 1 / -1; font-size: 1.15em; min-height: 54px; }
  @media (max-width: 760px) {
    .corps { grid-template-columns: minmax(0, 1fr); grid-template-rows: 1fr 1fr; }
    .gauche { border-right: 0; border-bottom: 1px solid var(--bord); }
    #listeArticles { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
  }

  /* fenetres */
  .voile { position: fixed; inset: 0; background: rgba(15,23,42,.55); z-index: 40; display: flex; align-items: flex-end; justify-content: center; }
  .fenetre { background: #fff; width: 100%; max-width: 560px; max-height: 92vh; overflow: auto; border-radius: 16px 16px 0 0; padding: 16px; padding-bottom: max(16px, env(safe-area-inset-bottom)); }
  @media (min-width: 761px) { .voile { align-items: center; } .fenetre { border-radius: 16px; } }
  .modes { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .modes button { padding: 8px 2px; font-size: .85em; }
  .lpay { border: 1px solid var(--bord); border-radius: 10px; padding: 10px; margin-top: 8px; background: #fafbfd; }
  .lpay .tete { display: flex; justify-content: space-between; align-items: center; font-weight: 700; }
  .lpay .grille { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .ok { color: var(--vert); font-weight: 700; }
  .ko { color: var(--rouge); font-weight: 700; }
  .rapides { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
  .rapides button { min-height: 36px; padding: 4px 10px; font-size: .9em; }
  .attente-l { display: flex; align-items: center; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--bord); }
  .attente-l .i { flex: 1; }

  /* restauration */
  .modes-vente { display: inline-flex; gap: 0; }
  .modes-vente button { border-radius: 0; }
  .modes-vente button:first-child { border-radius: 8px 0 0 8px; }
  .modes-vente button:last-child { border-radius: 0 8px 8px 0; }
  .barre .modes-vente button.actif { background: #fff; color: var(--marine); font-weight: 700; }
  #vueTables { flex: 1; overflow: auto; padding: 12px; }
  #grilleTables { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .table-t { border: 2px solid var(--bord); border-radius: 12px; background: #fff; padding: 12px; min-height: 96px; text-align: left; display: flex; flex-direction: column; gap: 4px; }
  .table-t .nom { font-weight: 700; font-size: 1.05em; }
  .table-t.libre { color: var(--gris); border-style: dashed; }
  .table-t.occupee { border-color: var(--vert); background: var(--vert-clair); }
  .table-t.attend { border-color: var(--orange); background: #fff4e5; }
  .table-t .tot { font-weight: 800; color: var(--marine); }
  .titre-section { font-size: .8em; text-transform: uppercase; letter-spacing: .04em; color: var(--gris); margin: 10px 0 4px; }
  .la { display: grid; grid-template-columns: 1fr auto auto; gap: 2px 8px; padding: 6px 0; border-bottom: 1px solid var(--bord); align-items: center; }
  .la .nt { font-size: .82em; color: var(--orange); grid-column: 1 / -1; }
  .env { color: var(--vert); font-size: .8em; }
  .nouveau { color: var(--orange); font-size: .8em; font-weight: 700; }
  .sel-l { display: grid; grid-template-columns: auto 1fr auto auto; gap: 8px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--bord); }
  .sel-l input[type=checkbox] { width: 22px; height: 22px; min-height: 0; }
  .sel-l input[type=number] { width: 80px; min-height: 36px; padding: 4px; text-align: center; }
  .bon { background: #fff; border: 1px dashed var(--bord); width: 302px; margin: 8px auto; padding: 8px 10px; font-family: "DejaVu Sans Mono", "Courier New", monospace; font-size: 13px; line-height: 1.35; color: #000; }
  .bon .poste { text-align: center; font-size: 22px; font-weight: 800; letter-spacing: 2px; border: 2px solid #000; padding: 2px; margin-bottom: 4px; }
  .bon.annul .poste { background: #000; color: #fff; }
  .bon .c { text-align: center; }
  .bon .big { font-size: 16px; font-weight: 700; }
  .bon .tr { border-top: 1px dashed #000; margin: 6px 0; }
  .bon .note { font-weight: 700; padding-left: 14px; }
  #ticket .bon { border: 0; margin: 0; width: auto; padding: 0 0 2mm; break-after: page; }
  #ticket .bon:last-child { break-after: auto; }
  /* ticket 80 mm */
  #ticket { background: #fff; border: 1px dashed var(--bord); width: 302px; margin: 0 auto; padding: 8px 10px; font-family: "DejaVu Sans Mono", "Courier New", monospace; font-size: 12px; line-height: 1.35; color: #000; }
  #ticket .c { text-align: center; }
  #ticket .g { font-weight: 700; }
  #ticket .tr { border-top: 1px dashed #000; margin: 6px 0; }
  #ticket .r { display: flex; justify-content: space-between; gap: 6px; }
  #ticket .r span:first-child { flex: 1; overflow-wrap: anywhere; }
  #ticket img.lg { max-width: 120px; max-height: 60px; display: block; margin: 0 auto 4px; }
  @page { size: 80mm 200mm; margin: 0; } /* la hauteur reelle est ajustee a l'impression (voir imprimerTicket) */
  @media print {
    body { background: #fff; }
    body > *:not(#zoneImpression) { display: none !important; }
    #zoneImpression { display: block !important; }
    #zoneImpression #ticket { border: 0; width: 72mm; margin: 0; padding: 2mm 3mm; font-size: 11px; }
  }
</style>
</head>
<body>

<div id="erreurGlobale" class="cache" role="alert"></div>
<div id="infoGlobale" class="cache"></div>

<!-- Connexion -->
<div id="ecranConnexion" class="ecran cache">
  <div class="logo-titre"><img src="/caisse-icon-192.png" alt="" /><h1 data-i="titreApp">IzyVendeur Caisse</h1><div class="raison" data-i="sousTitreApp"></div></div>
  <div class="carte">
    <label for="cxId" data-i="identifiant"></label><input id="cxId" autocomplete="username" autocapitalize="none" />
    <label for="cxMdp" data-i="motDePasse"></label><input id="cxMdp" type="password" autocomplete="current-password" />
    <button id="cxBtn" class="principal" style="width:100%;margin-top:14px;" data-i="seConnecter"></button>
    <div style="text-align:center;margin-top:12px;"><button id="cxLang" style="min-height:34px;padding:4px 10px;"></button></div>
  </div>
</div>

<!-- Choix du marchand (super-administrateur) -->
<div id="ecranChoix" class="ecran cache">
  <h2 data-i="choisirMarchand"></h2>
  <div class="carte"><div id="listeMarchands"></div></div>
  <div style="margin-top:12px;"><button id="choixDeco" data-i="deconnexion"></button></div>
</div>

<!-- Ouverture de caisse -->
<div id="ecranOuverture" class="ecran cache">
  <h2 data-i="ouvertureTitre"></h2>
  <div class="raison" data-i="ouvertureDesc" style="margin-bottom:10px;"></div>
  <div class="carte">
    <div id="tabOuv"></div>
    <h3 style="margin-top:12px;"><span data-i="totalBilletage"></span> <span id="totOuv">0</span> FCFA</h3>
    <button id="btnOuvrir" class="vert" style="width:100%;" data-i="ouvrirCaisse"></button>
  </div>
  <div style="margin-top:12px;display:flex;gap:8px;"><button id="ouvDeco" data-i="deconnexion"></button><button id="ouvRapport" data-i="mrBtn"></button><button id="ouvEntrees" class="cache" data-i="enBtn"></button><a href="/admin" style="align-self:center;" data-i="backOffice"></a></div>
</div>

<!-- Fermeture de caisse -->
<div id="ecranFermeture" class="ecran cache">
  <h2 data-i="fermetureTitre"></h2>
  <div class="raison" data-i="fermetureDesc" style="margin-bottom:10px;"></div>
  <div class="carte">
    <div id="tabFer"></div>
    <h3 style="margin-top:12px;"><span data-i="totalBilletage"></span> <span id="totFer">0</span> FCFA</h3>
    <label for="raisonEcart" data-i="raisonEcart"></label><textarea id="raisonEcart" rows="2"></textarea>
    <div class="raison" id="aideEcart"></div>
    <div style="display:flex;gap:8px;margin-top:12px;"><button id="btnFermer" class="principal" style="flex:1;" data-i="confirmerFermeture"></button><button id="btnAnnulerFermer" data-i="annuler"></button></div>
  </div>
</div>

<!-- Recapitulatif de cloture -->
<div id="ecranRecap" class="ecran cache">
  <h2 data-i="sessionFermee"></h2>
  <div class="carte" id="recapCorps"></div>
  <button id="recapOk" class="principal" style="margin-top:12px;width:100%;" data-i="retourCaisse"></button>
</div>

<!-- Vente -->
<div id="vente" class="cache">
  <div class="barre">
    <div class="nom"><span id="nomMarchand"></span><span class="sous" id="sousBarre"></span></div>
    <span id="modesVente" class="modes-vente cache"><button id="btnModeDirect" data-i="venteDirecte"></button><button id="btnModeTables" data-i="tables"></button></span>
    <button id="btnHL" class="cache"></button>
    <button id="btnClients" class="cache" data-i="cl_titre"></button>
    <button id="btnAttentes"></button>
    <button id="btnDernierTicket" data-i="dernierTicket"></button>
    <button id="btnChangerPoint" class="cache" data-i="chgPoint"></button>
    <button id="btnRapport" data-i="mrBtn"></button>
    <button id="btnEntrees" class="cache" data-i="enBtn"></button>
    <button id="btnRetour" class="cache" data-i="rtBtn"></button>
    <button id="btnCloture" data-i="cloturer"></button>
    <a href="/admin" data-i="backOffice"></a>
    <button id="btnLang"></button>
    <button id="btnDeco" data-i="deconnexion"></button>
  </div>
  <div id="bandeauHL" class="cache" data-i="hlBandeau"></div>
  <div id="vueTables" class="cache">
    <div style="display:flex;gap:8px;align-items:center;margin-bottom:10px;flex-wrap:wrap;"><h3 style="margin:0;margin-right:auto;" data-i="tables"></h3><button id="btnActualiserTables" data-i="actualiser"></button><button id="btnReglagesResto" class="cache" data-i="reglagesTables"></button></div>
    <div id="grilleTables"></div>
  </div>
  <div class="corps" id="corpsVente">
    <div class="gauche">
      <input id="recherche" type="search" autocomplete="off" data-ip="rechercher" />
      <div id="barreCat"></div>
      <div id="listeArticles"></div>
    </div>
    <div class="droite">
      <div id="droiteDirect" style="display:flex;flex-direction:column;min-height:0;flex:1;">
      <h3 data-i="panier"></h3>
      <div id="lignesPanier"></div>
      <div class="totaux">
        <div class="l"><span data-i="sousTotal"></span><span id="tSous">0</span></div>
        <div class="l cache" id="ligneRemise"><span id="libRemise"></span><span id="tRemise">0</span></div>
        <div class="l grand"><span data-i="total"></span><span id="tTotal">0 FCFA</span></div>
      </div>
      <div class="actions">
        <button id="btnRemise" class="cache" data-i="remise"></button>
        <button id="btnMettreAttente" data-i="mettreAttente"></button>
        <button id="btnVider" class="danger" data-i="vider"></button>
        <button id="btnPayer" class="vert payer" data-i="payer"></button>
      </div>
      </div>
      <div id="droiteResto" class="cache" style="display:flex;flex-direction:column;min-height:0;flex:1;overflow:auto;"></div>
    </div>
  </div>
</div>

<!-- Fenetres -->
<div id="voile" class="voile cache"><div class="fenetre" id="fenetre"></div></div>

<!-- Ticket (imprimable en 80 mm) -->
<div id="zoneImpression" class="cache"><div id="ticket"></div></div>

<script>

  PAY.forEach((p) => { if (p.mode !== "especes" && (!(entier(p.montant) > 0) || !(p.reference || "").trim())) ok = false; });
  if (!PAY.some((p) => p.mode !== "especes" ? true : entier(p.montant) > 0)) ok = false;
  // Etape 90 : part a credit (jamais au-dela du total ni du credit disponible du client) ; vente entierement a credit = aucun paiement.
  if (credit > 0) {

// Les navigateurs n'acceptent pas « 80mm auto » : on mesure le ticket et on fixe la hauteur de page juste necessaire (rouleau de 80 mm, pas de gaspillage).
function ajusterPagePapier() {
  const zone = $("zoneImpression"), tk = $("ticket");
  const pxVersMm = 25.4 / 96;
  // Plusieurs bons : une page par bon, a la hauteur du plus long (la page est coupee entre deux bons par l'imprimante).
  const bons = tk.querySelectorAll(".bon");
  const hauteur = bons.length ? Math.max.apply(null, Array.prototype.map.call(bons, (b) => b.scrollHeight)) : tk.scrollHeight;
  const mm = Math.ceil(hauteur * pxVersMm * (72 / 79.9)) + 8; // largeur imprimee 72 mm contre 302 px a l'ecran
  let st = document.getElementById("stylePage");
  if (!st) { st = document.createElement("style"); st.id = "stylePage"; document.head.appendChild(st); }
  st.textContent = "@page { size: 80mm " + Math.max(60, mm) + "mm; margin: 0; }";
}

      const csv = ["numero;date;total;statut;erreur;articles;paiements"].concat(liste.map((x) => [x.numeroLocal, x.saisieLe, x.total, x.statut, (x.erreur || "").replace(/;/g, ","), x.lignes.map((l) => l.quantite + " x " + l.productId + " @" + l.prixUnitaire).join(" | "), x.paiements.map((p) => p.mode + ":" + p.montant).join(" | ")].join(";"))).join("\n");
      const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" })); a.download = "ventes-hors-ligne.csv"; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    };
    Array.prototype.forEach.call($("fenetre").querySelectorAll("button[data-r]"), (b) => { b.onclick = async () => { const x = liste[Number(b.dataset.r)]; x.statut = "attente"; delete x.erreur; try { await tx("file", "readwrite", (s) => s.put(x)); } catch (e) {} fermerFenetre(); H.synchroniser(); }; });
    Array.prototype.forEach.call($("fenetre").querySelectorAll("button[data-a]"), (b) => { b.onclick = async () => {
      if (b.dataset.sur !== "1") { b.dataset.sur = "1"; b.textContent = t("hlConfirmAbandon"); return; }
      const x = liste[Number(b.dataset.a)]; file = file.filter((y) => y.cle !== x.cle); try { await tx("file", "readwrite", (s) => s.delete(x.cle)); } catch (e) {} majStatut(); H.fenetreFile();
    }; });
  };
  function majStatut() {
    const b = $("btnHL"), bandeau = $("bandeauHL"); if (!b) return;
    const n = H.option() ? H.fileDuMarchand().length : 0, nErr = H.option() ? H.fileDuMarchand().filter((x) => x.statut === "erreur").length : 0;
    const visible = H.option() && (H.actif || n > 0);
    b.classList.toggle("cache", !visible); bandeau.classList.toggle("cache", !(H.option() && H.actif));
    b.classList.toggle("hors", H.actif || nErr > 0);
    b.textContent = H.actif ? t("hlHorsLigne") + (n ? " · " + n : "") : (enCours ? t("hlSynchro") : t("hlAEnvoyer", { n }));
    majBarreDepuisHL();
  }
  H.majStatut = majStatut;
  return H;
})();
function majBarreDepuisHL() { const peutRemise = E.moi && (E.moi.role !== "employe" || (E.moi.roles || []).indexOf("remises") !== -1); $("btnRemise").classList.toggle("cache", !peutRemise || HL.actif); $("btnClients").classList.toggle("cache", !credOn() || HL.actif); appliquerRestriction(); }
$("btnHL").onclick = () => HL.fenetreFile();

/* ============ Demarrage ============ */
(async function demarrer() {
  appliquerLangue();
  if ("serviceWorker" in navigator) { navigator.serviceWorker.register("/caisse-sw.js", { scope: "/caisse" }).catch(() => {}); }
  try {
    E.moi = await api("/api/moi");
    await choisirMarchand();
  } catch (e) { if (e && e.reseau && await HL.demarrerHorsLigne()) return; montrer("ecranConnexion"); }
})();
</script>
