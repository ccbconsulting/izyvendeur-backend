// Pont IzyFacture (voir izyfacture.js/server.js) : badge + bouton "Facturer"/"Réessayer" par commande, dans
// l'onglet Commandes. Toujours affiche (meme si le marchand n'a pas encore connecte IzyFacture) - le bouton
// renvoie alors une erreur claire ("Aucune clé IzyFacture enregistrée...") plutot que d'obliger a deviner
// pourquoi la colonne est absente.
// Sous-bloc "paiement" affiche SOUS le badge de facture, uniquement une fois la commande facturee (une
// commande non facturee n'a pas encore de facture IzyFacture sur laquelle enregistrer un paiement - voir
// la route /izyfacture/paiement, qui refuse explicitement dans ce cas). izyfactureFactureStatut/
// izyfactureSolde/izyfactureRecuNumero sont ecrits par server.js (enregistrerPaiementCommande) a partir de
// la reponse d'IzyFacture (invoice.status/invoice.balance/receipt.number), jamais devines cote client.
function celluleFacturePaiement(o) {
  let badge;
  if (o.izyfactureFactureStatut === "paid") {
    badge = "<span style='background:#e6f7e6; color:#1e7a1e; padding:2px 8px; border-radius:10px; font-size:0.85em; white-space:nowrap;'>" + esc(t("badgeIzyfacturePayee")) + "</span>";
  } else if (o.izyfactureFactureStatut === "partially_paid") {
    badge = "<span style='background:#fff3cd; color:#7a5c00; padding:2px 8px; border-radius:10px; font-size:0.85em; white-space:nowrap;'>" + esc(t("badgeIzyfacturePartielle", { solde: (o.izyfactureSolde != null ? o.izyfactureSolde : "?") })) + "</span>";
  } else {
    badge = "<span style='color:#999;'>" + esc(t("badgeIzyfactureNonPayee")) + "</span>";
  }
  const recu = o.izyfactureRecuNumero
    ? "<div style='font-size:0.8em; color:#666;'>" + esc(t("labelIzyfactureRecu", { numero: o.izyfactureRecuNumero })) + "</div>"
    : "";
  const bouton = o.izyfactureFactureStatut === "paid"
    ? ""
    : "<div><button data-izyfacturepaiement='" + o.id + "' style='margin-top:4px;'>" + esc(t("btnIzyfacturePaiement")) + "</button></div>";
  return "<div style='margin-top:4px;'>" + badge + "</div>" + recu + bouton;
}

function celluleIzyfacture(o) {
  let badge, bouton = "";
  if (o.izyfactureStatut === "facturee") {
    badge = "<span style='background:#e6f7e6; color:#1e7a1e; padding:2px 8px; border-radius:10px; font-size:0.85em; white-space:nowrap;'>" + esc(t("badgeIzyfactureFacturee", { numero: o.izyfactureNumero || "" })) + "</span>";
    // Lien de verification public (invoice.verifyUrl) - n'existe que si le marchand a le volet "QR de
    // verification" chez IzyFacture (formules Pro/Cabinet) ; absent sinon, pas de ligne affichee dans ce cas.
    if (o.izyfactureUrlVerification) {
      badge += "<div style='font-size:0.8em;'><a href='" + esc(o.izyfactureUrlVerification) + "' target='_blank' rel='noopener'>" + esc(t("labelIzyfactureVerification")) + "</a></div>";
    }
    badge += celluleFacturePaiement(o);
  } else if (o.izyfactureStatut === "avoir") {
    badge = "<span style='background:#f0e6ff; color:#5a2a9e; padding:2px 8px; border-radius:10px; font-size:0.85em; white-space:nowrap;'>" + esc(t("badgeIzyfactureAvoir", { numero: o.izyfactureAvoirNumero || "" })) + "</span>";
  } else if (o.izyfactureStatut === "en_attente") {
    badge = "<span style='background:#fff3cd; color:#7a5c00; padding:2px 8px; border-radius:10px; font-size:0.85em; white-space:nowrap;'>" + esc(t("badgeIzyfactureEnAttente")) + "</span>";
    bouton = "<button data-izyfacturer='" + o.id + "' style='margin-top:4px;'>" + esc(t("btnIzyfactureReessayer")) + "</button>";
  } else if (o.izyfactureStatut === "erreur") {
    badge = "<span style='background:#fde2e2; color:#a12b2b; padding:2px 8px; border-radius:10px; font-size:0.85em; white-space:nowrap;' title=\"" + esc(o.izyfactureErreur || "") + "\">" + esc(t("badgeIzyfactureErreur")) + "</span>";
    bouton = "<button data-izyfacturer='" + o.id + "' style='margin-top:4px;'>" + esc(t("btnIzyfactureReessayer")) + "</button>";
  } else {
    badge = "<span style='color:#999;'>" + esc(t("badgeIzyfactureAucune")) + "</span>";
    bouton = "<button data-izyfacturer='" + o.id + "' style='margin-top:4px;'>" + esc(t("btnIzyfactureFacturer")) + "</button>";
  }
  return "<div>" + badge + "</div>" + (bouton ? "<div>" + bouton + "</div>" : "");
}

async function renderCommandes() {
  const zone = document.getElementById("contenuOnglet");
  zone.innerHTML = "<div class='chargement'>" + t("chargement") + "</div>";
  const commandes = await api("/api/" + marchandActif.id + "/commandes");
  const statuts = ["Nouvelle", "Confirmée", "Commandée", "Expédiée", "Livrée", "Annulée"];

  let visibles = commandes.slice();
  if (commandesFiltreStatut !== "Tous") visibles = visibles.filter((o) => o.statut === commandesFiltreStatut);
  if (commandesFiltreMode !== "Tous") {
    // "Boutique" (vente comptoir, source:"pos") est un mode a part - jamais confondu avec Livraison/Retrait,
    // qui ne concernent que les commandes venues du bot WhatsApp (29 sept 2026).
    visibles = visibles.filter((o) => {
      const mode = o.source === "pos" ? "Boutique" : (o.modeLivraison === "retrait" ? "Retrait" : "Livraison");
      return mode === commandesFiltreMode;
    });
  }
  if (commandesFiltrePeriodeType === "jour" && commandesFiltreJour) {
    visibles = visibles.filter((o) => new Date(o.dateISO).toISOString().slice(0, 10) === commandesFiltreJour);
  } else if (commandesFiltrePeriodeType === "plage" && commandesFiltrePlageDu && commandesFiltrePlageAu) {
    visibles = visibles.filter((o) => {
      const jour = new Date(o.dateISO).toISOString().slice(0, 10);
      return jour >= commandesFiltrePlageDu && jour <= commandesFiltrePlageAu;
    });
  }
  visibles.sort((a, b) => {
    const diff = new Date(a.dateISO) - new Date(b.dateISO);

      "<label>" + t("labelDate") + "<select id='commandesSelTri'>" +
        "<option value='recent'" + (commandesTriDate === "recent" ? " selected" : "") + ">" + t("optionPlusRecentes") + "</option>" +
        "<option value='ancien'" + (commandesTriDate === "ancien" ? " selected" : "") + ">" + t("optionPlusAnciennes") + "</option>" +
      "</select></label>" +

        "<option value='toutes'" + (commandesFiltrePeriodeType === "toutes" ? " selected" : "") + ">" + t("optionPeriodeToutes") + "</option>" +
        "<option value='jour'" + (commandesFiltrePeriodeType === "jour" ? " selected" : "") + ">" + t("optionPeriodeJour") + "</option>" +

  // methode, reference optionnelle), dans le meme esprit minimal que promptRaisonAnnulation ci-dessus - pas de
  // vraie boite de dialogue dans cette interface. La methode saisie en texte libre est normalisee cote client

  // rien de connu, on l'envoie telle quelle et on laisse le serveur (donc IzyFacture) la refuser clairement.
  Array.prototype.forEach.call(zone.querySelectorAll("[data-izyfacturepaiement]"), (btn) => {

        if (resultat.izyfactureRecuNumero) alert(t("alertIzyfacturePaiementEnregistre", { numero: resultat.izyfactureRecuNumero }));
        else alert(t("alertIzyfacturePaiementEnregistreSansRecu"));

      } catch (e) {
        alert(t("alertIzyfacturePaiementEchec", { erreur: e.message }));
        btn.disabled = false;
      }
    });
  });
}

// Normalise une saisie libre de moyen de paiement vers les codes attendus par l'API IzyFacture (voir
// API-IZYVENDEUR.md section 3, champ payment.method) - accepte le francais courant en plus des codes eux-memes,
// pour que le marchand n'ait pas besoin de connaitre le vocabulaire exact de l'API.
function normaliserMethodePaiement(saisie) {
  const s = String(saisie || "").trim().toLowerCase();
  if (!s) return "especes";
  if (/^especes?$|^esp[eè]ces?$|cash/.test(s)) return "especes";
  if (/^om$|orange/.test(s)) return "om";
  if (/^momo$|mtn/.test(s)) return "momo";
  if (/^banque$|virement|bank/.test(s)) return "banque";
  if (/^ch[eè]que$|cheque/.test(s)) return "cheque";
  return s; // valeur inconnue : envoyee telle quelle, le serveur/IzyFacture la refusera clairement si invalide
}

// Bloc "Parametres de caisse" (option payante superadmin "optionCaissePos", voir blocOptionsPayantesHtml
// plus bas) : le marchand definit LUI-MEME le seuil de tolerance sur l'ecart de caisse, la liste des
// coupures qu'il manipule reellement, et si un seul tiroir peut etre ouvert a la fois ou plusieurs en
// parallele - voir configCaisse()/ouvrirSessionCaisse()/fermerSessionCaisse() dans conversation.js. Les
// coupures sont saisies comme une liste separee par des virgules plutot qu'un editeur ligne par ligne :
// plus rapide a corriger pour le marchand, et le resultat est le meme (un tableau de nombres).
function blocCaisseParametresHtml(caisse) {
  const c = caisse || {};
  const coupures = Array.isArray(c.coupures) ? c.coupures : [];
  return "<h3>" + t("h3CaisseParametres") + "</h3>" +
    "<p style='color:#666; font-size:0.9em;'>" + t("descCaisseParametres") + "</p>" +
    "<label>" + t("labelCaisseSeuilEcart") + "</label>" +
    "<input id='caisseSeuilEcart' type='number' min='0' step='1' value=\"" + (Number(c.seuilEcart) || 0) + "\" />" +
    "<label>" + t("labelCaisseCoupures") + "</label>" +
    "<input id='caisseCoupures' value=\"" + esc(coupures.join(", ")) + "\" placeholder=\"" + esc(t("placeholderCaisseCoupures")) + "\" />" +
    "<label style='display:flex; align-items:center; gap:8px; margin-top:10px; font-weight:normal;'>" +
      "<input type='checkbox' id='caisseSessionUnique'" + (c.sessionUnique !== false ? " checked" : "") + " /> " + t("labelCaisseSessionUnique") +
    "</label>";
}
function lireCaisseParametresFormulaire() {
  const coupures = document.getElementById("caisseCoupures").value
    .split(",")
    .map((v) => Math.round(Number(v.trim())))
    .filter((v) => Number.isFinite(v) && v > 0);
  const coupuresUniques = Array.from(new Set(coupures)).sort((a, b) => b - a);
  return {
    seuilEcart: Math.max(0, Math.round(Number(document.getElementById("caisseSeuilEcart").value) || 0)),
    coupures: coupuresUniques,
    sessionUnique: document.getElementById("caisseSessionUnique").checked
  };
}

  // Praticiens (staff pouvant recevoir des rendez-vous en parallele) : vide par defaut, ce qui garde
  // l'ancien comportement (une seule ressource a la fois) tant que le marchand n'en ajoute pas ici. Etat
  // local independant, redessine seulement cette liste (voir redrawPraticiens) pour ne jamais perdre une
  // saisie en cours dans les horaires/duree/message au-dessus au moment d'ajouter/retirer un praticien.
  let localPraticiens = JSON.parse(JSON.stringify(parametres.praticiens || []));

  zone.innerHTML =
    "<h2>" + t("paramTitre") + "</h2>" +
    "<label>" + t("labelDureeCreneau") + "</label>" +
    "<input type='number' id='dureeCreneau' value='" + (parametres.dureeCreneauMinutes || 30) + "' />" +
    "<h3>" + t("h3HorairesOuverture") + "</h3>" +
    "<p class='raison'>" + t("notePause") + "</p>" +
    "<table class='table-donnees'><tr><th>" + t("theadJour") + "</th><th>" + t("theadOuvert") + "</th><th>" + t("theadDebut") + "</th><th>" + t("theadFin") + "</th><th>" + t("theadPauseDebut") + "</th><th>" + t("theadPauseFin") + "</th></tr>" +
    jours.map((j) => {
      const h = horaires[j] || { ouvert: false, debut: "08:00", fin: "18:00" };
      return "<tr><td>" + esc(libelleJour(j)) + "</td>" +
        "<td><input type='checkbox' data-jour='" + j + "' data-champ='ouvert'" + (h.ouvert ? " checked" : "") + " /></td>" +
        "<td><input type='time' data-jour='" + j + "' data-champ='debut' value='" + h.debut + "' /></td>" +
        "<td><input type='time' data-jour='" + j + "' data-champ='fin' value='" + h.fin + "' /></td>" +
        "<td><input type='time' data-jour='" + j + "' data-champ='pauseDebut' value='" + (h.pauseDebut || "") + "' /></td>" +
        "<td><input type='time' data-jour='" + j + "' data-champ='pauseFin' value='" + (h.pauseFin || "") + "' /></td></tr>";
    }).join("") +
    "</table>" +
    "<h3>" + t("h3Praticiens") + "</h3>" +
    "<p class='raison'>" + t("notePraticiens") + "</p>" +
    "<div id='listePraticiens'></div>" +
    "<button id='btnAjouterPraticien'>" + t("btnAjouterPraticien") + "</button>" +
    "<label>" + t("labelMsgConfirmRdv") + "</label>" +
    "<textarea id='msgConfirm' rows='6'>" + esc(parametres.autoConfirmMessage || "") + "</textarea>" +
    "<div><button id='btnSauverParams' class='principal'>" + t("enregistrer") + "</button></div>";

  function redrawPraticiens() {
    const conteneur = document.getElementById("listePraticiens");
    conteneur.innerHTML = localPraticiens.length
      ? "<table class='table-donnees'><tr><th>" + t("theadNom") + "</th><th></th></tr>" +
        localPraticiens.map((p, i) =>
          "<tr>" +
            "<td><input data-praticien-i='" + i + "' value=\"" + esc(p.nom || "") + "\" placeholder=\"" + esc(t("placeholderNomPraticien")) + "\" /></td>" +
            "<td><button data-praticien-suppr='" + i + "' class='danger'>×</button></td>" +
          "</tr>"
        ).join("") +
        "</table>"
      : "<p class='raison'>" + t("msgAucunPraticien") + "</p>";

    Array.prototype.forEach.call(conteneur.querySelectorAll("input[data-praticien-i]"), (inp) => {
      inp.addEventListener("input", () => {
        localPraticiens[Number(inp.dataset.praticienI)].nom = inp.value;
      });
    });
    Array.prototype.forEach.call(conteneur.querySelectorAll("[data-praticien-suppr]"), (btn) => {
      btn.onclick = () => { localPraticiens.splice(Number(btn.dataset.praticienSuppr), 1); redrawPraticiens(); };
    });
  }
  redrawPraticiens();

  document.getElementById("btnAjouterPraticien").onclick = () => {
    localPraticiens.push({ id: "pr" + Date.now() + Math.floor(Math.random() * 1000), nom: "" });
    redrawPraticiens();
  };

  document.getElementById("btnSauverParams").onclick = async () => {
    const nouvHoraires = {};
    jours.forEach((j) => {
      nouvHoraires[j] = {
        ouvert: zone.querySelector("[data-jour='" + j + "'][data-champ='ouvert']").checked,
        debut: zone.querySelector("[data-jour='" + j + "'][data-champ='debut']").value,
        fin: zone.querySelector("[data-jour='" + j + "'][data-champ='fin']").value,
        pauseDebut: zone.querySelector("[data-jour='" + j + "'][data-champ='pauseDebut']").value || null,
        pauseFin: zone.querySelector("[data-jour='" + j + "'][data-champ='pauseFin']").value || null
      };
    });
    const nouvPraticiens = localPraticiens
      .map((p) => ({ id: p.id, nom: (p.nom || "").trim() }))
      .filter((p) => p.nom); // une ligne laissee vide (nom jamais rempli) est simplement ignoree
    try {
      await api("/api/" + marchandActif.id + "/parametres", {
        method: "PUT",
        body: JSON.stringify({
          dureeCreneauMinutes: Number(document.getElementById("dureeCreneau").value),
          horaires: nouvHoraires,
          praticiens: nouvPraticiens,
          autoConfirmMessage: document.getElementById("msgConfirm").value
        })
      });
      alert(t("alertParametresEnregistres"));
      renderParametresService();
    } catch (e) { alert(t("erreurPrefixe") + e.message); }
  };
}

// ---------------- Conversations en attente d'un humain ----------------

function formaterDureeDepuis(depuisISO) {
  const minutes = Math.max(0, Math.round((Date.now() - new Date(depuisISO).getTime()) / 60000));
  if (minutes < 1) return t("enAttenteInstant");
  if (minutes === 1) return t("enAttenteUneMinute");
  return t("enAttenteMinutes", { n: minutes });
}

let vueHistoriqueTelephone = null; // numero actuellement ouvert en detail dans "Historique", ou null (liste)

function formaterDateHeure(iso) {
  if (!iso) return "—";
  const d = new Date(iso);
  return d.toLocaleDateString(localeCourante()) + " " + (langueAdmin === "en" ? "at" : "à") + " " + d.toLocaleTimeString(localeCourante(), { hour: "2-digit", minute: "2-digit" });
}

async function renderConversations() {
  const zone = document.getElementById("contenuOnglet");
  zone.innerHTML = "<div class='chargement'>" + t("chargement") + "</div>";
  const conversations = await api("/api/" + marchandActif.id + "/conversations");

  let html = "<h2>" + t("conversationsTitre") + "</h2>";

  if (!conversations.length) {
    html += "<p>" + t("msgAucunClientAttend") + "</p>";
  } else {
    html +=
      "<h3 style='margin-top:0;'>" + t("h3EnAttenteHumain", { n: conversations.length }) + "</h3>" +
      "<p class='raison'>" + t("noteAttenteHumain") + "</p>" +
      conversations.map((c, i) =>
        "<div class='carte-produit'>" +
          "<div style='display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px;'>" +
            "<strong>" + esc(c.telephone) + "</strong>" +
            "<span class='raison'>" + formaterDureeDepuis(c.depuisISO) + "</span>" +
          "</div>" +
          "<div style='max-height:160px; overflow-y:auto; margin:10px 0; padding:8px; background:#f6f7f9; border-radius:6px; font-size:0.9em;'>" +
            (c.historique || []).map((m) =>
              "<div style='margin-bottom:6px;'><strong>" + (m.de === "marchand" ? t("labelVous") : t("labelClient")) + " :</strong> " + esc(m.texte) + "</div>"
            ).join("") +
          "</div>" +
          "<textarea data-reponse='" + i + "' rows='2' placeholder=\"" + esc(t("placeholderReponseClient")) + "\"></textarea>" +
          "<div style='margin-top:8px;'><button data-envoyer='" + i + "' class='principal'>" + t("btnEnvoyer") + "</button></div>" +
        "</div>"
      ).join("");
  }

  html += "<h3>" + t("h3HistoriqueComplet") + "</h3><div id='zoneHistorique'><div class='chargement'>" + t("chargement") + "</div></div>";

  zone.innerHTML = html;

  Array.prototype.forEach.call(zone.querySelectorAll("[data-envoyer]"), (btn) => {
    btn.onclick = async () => {
      const i = Number(btn.dataset.envoyer);
      const texte = zone.querySelector("[data-reponse='" + i + "']").value.trim();
      if (!texte) { alert(t("alertEcrireMessage")); return; }
      try {
        await api("/api/" + marchandActif.id + "/conversations/" + encodeURIComponent(conversations[i].telephone) + "/repondre", {
          method: "POST",
          body: JSON.stringify({ message: texte })
        });
        renderConversations();
      } catch (e) { alert(t("erreurPrefixe") + e.message); }
    };
  });

  if (vueHistoriqueTelephone) renderHistoriqueDetail(vueHistoriqueTelephone);
  else renderHistoriqueListe();
}

async function renderTableauDeBord() {
  const zone = document.getElementById("contenuOnglet");
  zone.innerHTML = "<div class='chargement'>" + t("chargement") + "</div>";
  const d = await api("/api/" + marchandActif.id + "/tableau-de-bord?periode=" + encodeURIComponent(dashboardPeriodeActuelle));
  const estCatalogue = marchandActif.type !== "service";
  const jours = t("joursAbrev");
  const maxSpark = Math.max(1, ...d.sparkline7j);
  const aujourdhuiIndex = (new Date().getDay() + 6) % 7; // 0 = lundi

  const selecteurPeriode =
    "<div class='controles-rapport'>" +
      "<div><label>" + t("labelPeriodeDashboard") + "</label><select id='dashPeriode'>" +
        "<option value='jour'>" + t("optionJour") + "</option>" +
        "<option value='semaine'>" + t("optionSemaine") + "</option>" +
        "<option value='mois'>" + t("optionMois") + "</option>" +
        "<option value='trimestre'>" + t("optionTrimestre") + "</option>" +
        "<option value='annee'>" + t("optionAnnee") + "</option>" +
      "</select></div>" +
      "<div class='raison'>" + esc(new Date(d.debutISO).toLocaleDateString(localeCourante())) + " – " + esc(new Date(new Date(d.finISO).getTime() - 1).toLocaleDateString(localeCourante())) + "</div>" +
    "</div>";

  // Chaque tuile renvoie vers l'onglet ou est detaillee la donnee affichee - mais seulement si cet
  // onglet existe reellement pour ce marchand/cet utilisateur (ex: pas de "rapports" pour un marchand de
  // type service, pas de "conversations" pour un employe sans ce role) : sinon la tuile reste une simple
  // tuile d'information, non cliquable, pour ne pas promettre une navigation qui ne mene nulle part.
  function estOngletVisible(idOnglet) {
    return !!document.querySelector("#barreOnglets button[data-onglet='" + idOnglet + "']");
  }
  function tuile(idOngletCible, valeurHtml, libelle, avertissement) {
    const cliquable = idOngletCible && estOngletVisible(idOngletCible);
    const classes = "tuile" + (avertissement ? " avertissement" : "") + (cliquable ? " cliquable" : "");
    const attrs = cliquable
      ? " data-tuile-onglet='" + idOngletCible + "' tabindex='0' role='button'"
      : "";
    return "<div class='" + classes + "'" + attrs + "><div class='valeur'>" + valeurHtml + "</div><div class='libelle'>" + libelle + "</div></div>";
  }

  let tuiles = "<div class='tuiles'>" +
    tuile(estCatalogue ? "commandes" : "rendezvous", d.commandesPeriode, estCatalogue ? t("libelleCommandesPeriodeDash") : t("libelleRdvPeriodeDash")) +
    tuile(estCatalogue ? "rapports" : "rendezvous", (d.caPeriode || 0).toLocaleString(localeCourante()) + " FCFA", t("libelleCaPeriodeDash")) +
    tuile("conversations", d.conversationsEnAttente, t("libelleConvEnAttente"), d.conversationsEnAttente);
  if (estCatalogue) {
    tuiles +=
      tuile("inventaire", d.alertesStock, t("libelleArticlesSurveiller"), d.alertesStock) +
      tuile("inventaire", d.ruptures, t("libelleRuptures"), d.ruptures);
  }
  tuiles += "</div>";

  const sparkline =
    "<h3>" + t("h3Activite7j") + "</h3>" +
    "<div class='sparkline'>" +
      d.sparkline7j.map((v, i) => {
        const jourReel = new Date(); jourReel.setDate(jourReel.getDate() - (6 - i));
        const label = jours[(jourReel.getDay() + 6) % 7];
        return "<div class='colonne'><div class='barre' style='height:" + Math.max(4, Math.round((v / maxSpark) * 80)) + "px' title='" + v + "'></div><div class='jour-label'>" + label + "</div></div>";
      }).join("") +
    "</div>";

  const top =
    "<h3>" + (estCatalogue ? t("h3ArticlesTop") : t("h3ServicesTop")) + "</h3>" +
    (d.topProduits.length
      ? (estCatalogue
          ? tableVentesParArticleHtml(d.topProduits, t("theadArticleCourt"))
          : "<table class='table-donnees'><tr><th>" + t("theadServiceCourt") + "</th><th>" + t("theadQuantite") + "</th></tr>" +
            d.topProduits.map((p) => "<tr><td>" + esc(p.nom) + "</td><td>" + p.quantite + "</td></tr>").join("") + "</table>")
      : "<p class='raison'>" + t("msgPasAssezDonnees") + "</p>");

  let bas;
  if (estCatalogue) {
    bas =
      "<h3>" + t("h3StockASurveiller") + "</h3>" +
      (d.stockASurveiller.length
        ? "<table class='table-donnees'><tr><th>" + t("theadArticleCourt") + "</th><th>" + t("theadCouleur") + "</th><th>" + t("theadTaille") + "</th><th>" + t("theadStockReel") + "</th><th>" + t("theadStockVirtuel") + "</th><th>" + t("theadSeuilAlerte") + "</th></tr>" +
          d.stockASurveiller.map((v) =>
            "<tr class=\"" + (v.stockVirtuel <= 0 ? "alerte-stock" : "") + "\"><td>" + esc(v.produit) + "</td><td>" + esc(v.couleur) + "</td><td>" + esc(v.taille) + "</td><td>" + v.stockReel + "</td><td>" + v.stockVirtuel + "</td><td>" + v.seuil + "</td></tr>"
          ).join("") + "</table>"
        : "<p class='raison'>" + t("msgAucunArticleSousLeSeuil") + "</p>");
  } else {
    bas =
      "<h3>" + t("h3ProchainsRdv") + "</h3>" +
      (d.prochainsRendezVous.length
        ? "<table class='table-donnees'><tr><th>" + t("theadRef") + "</th><th>" + t("theadDateHeure") + "</th><th>" + t("theadService") + "</th><th>" + t("theadClient") + "</th><th>" + t("theadStatut") + "</th></tr>" +
          d.prochainsRendezVous.map((a) =>
            "<tr><td>" + esc(a.reference) + "</td><td>" + esc(new Date(a.dateISO).toLocaleString(localeCourante())) + "</td><td>" + esc(a.service) + "</td><td>" + esc(a.clientNom) + "</td><td>" + esc(libelleStatutRdv(a.statut)) + "</td></tr>"
          ).join("") + "</table>"
        : "<p class='raison'>" + t("msgAucunRdvProchain") + "</p>");
  }

  zone.innerHTML = "<h2>" + t("tableauDeBordTitre") + "</h2>" + selecteurPeriode + tuiles + sparkline + top + bas;
  brancherDeplierVentes(zone);

  Array.prototype.forEach.call(zone.querySelectorAll(".tuile.cliquable"), (el) => {
    const cible = el.dataset.tuileOnglet;
    el.addEventListener("click", () => allerVersOnglet(cible));
    el.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); allerVersOnglet(cible); }
    });
  });

  const selectPeriode = document.getElementById("dashPeriode");
  selectPeriode.value = dashboardPeriodeActuelle;
  selectPeriode.onchange = () => {
    dashboardPeriodeActuelle = selectPeriode.value;
    renderTableauDeBord();
  };
}

// ---------------- Simulateur WhatsApp ----------------

// Historique de conversation affiché à l'écran, par marchand (purement visuel : la vraie session de
// test vit côté serveur sous le numéro réservé PHONE_SIMULATEUR — voir conversation.js/conversationService.js).
const simulateurHistoriques = {};

async function renderSimulateur() {
  const zone = document.getElementById("contenuOnglet");
  const id = marchandActif.id;
  if (!simulateurHistoriques[id]) simulateurHistoriques[id] = [];
  const historique = simulateurHistoriques[id];
  const aUneTrace = marchandActif.type !== "service";

  function dessiner() {
    zone.innerHTML =
      "<h2>" + t("simulateurTitre") + "</h2>" +
      "<p class='raison'>" + t("noteSimulateur") + "</p>" +
      "<div id='chatFenetre' class='chat-fenetre'>" +
        (historique.length ? historique.map((m) =>
          "<div class='bulle " + (m.de === "client" ? "client" : "bot") + "'>" +
            (m.traceAssociee && m.traceAssociee.photo ? "<img src=\"" + esc(m.traceAssociee.photo) + "\" alt='' />" : "") +
            esc(m.texte) +
          "</div>"
        ).join("") : "<p class='raison'>" + t("msgEnvoyezPremierMessage") + "</p>") +
      "</div>" +
      "<div class='zone-saisie-chat'>" +
        "<input id='champMessageSimu' placeholder=\"" + esc(t("placeholderMessageSimu")) + "\" />" +
        "<button id='btnEnvoyerSimu' class='principal'>" + t("btnEnvoyer") + "</button>" +
        "<button id='btnResetSimu'>" + t("btnReinitialiser") + "</button>" +
      "</div>" +
      (aUneTrace ? "<h3>" + t("h3AnalyseMessage") + "</h3><div id='panneauAnalyse' class='panneau-analyse'>" + rendreTrace(historique.length ? historique[historique.length - 1].traceAssociee : null) + "</div>" : "");

    const fenetre = document.getElementById("chatFenetre");
    fenetre.scrollTop = fenetre.scrollHeight;

    const champ = document.getElementById("champMessageSimu");
    document.getElementById("btnEnvoyerSimu").onclick = envoyer;
    champ.addEventListener("keydown", (e) => { if (e.key === "Enter") envoyer(); });
    document.getElementById("btnResetSimu").onclick = async () => {
      try {
        await api("/api/" + id + "/simulateur/reset", { method: "POST" });
        simulateurHistoriques[id] = [];
        renderSimulateur();
      } catch (e) { alert(t("erreurPrefixe") + e.message); }
    };

    async function envoyer() {
      const texte = champ.value.trim();
      if (!texte) return;
      historique.push({ de: "client", texte });
      champ.value = "";
      dessiner();
      try {
        const rep = await api("/api/" + id + "/simulateur/message", { method: "POST", body: JSON.stringify({ message: texte }) });
        historique.push({ de: "bot", texte: rep.reponse, traceAssociee: rep.trace });
        dessiner();
        document.getElementById("champMessageSimu").focus();
      } catch (e) { alert(t("erreurPrefixe") + e.message); }
    }
  }

  function rendreTrace(trace) {
    if (!trace) return "<p class='raison'>" + t("msgAucuneAnalyse") + "</p>";
    const entites = Object.keys(trace.entites || {}).map((k) => "<div><strong>" + esc(k) + " :</strong> " + esc(trace.entites[k]) + "</div>").join("");
    return entites +
      (trace.verification ? "<div><strong>" + t("labelVerification") + "</strong> " + esc(trace.verification) + "</div>" : "") +
      "<div><strong>" + t("labelAction") + "</strong> " + esc(trace.action) + "</div>" +
      (trace.photo ? "<div><strong>" + t("labelPhotoEnvoyee") + "</strong></div>" : "");
  }

  dessiner();
}

// Genere un PDF cote NAVIGATEUR (bibliotheque jsPDF, voir <script src> plus haut) - aucun changement cote
// serveur. Mise en page volontairement simple (titre + sous-titres + sections de lignes, avec retour a la
// ligne et saut de page automatiques) plutot qu'un tableau a colonnes fixes, pour rester fiable quels que
// soient la longueur des noms d'articles/instantanés et le nombre de lignes.
function pdfDisponible() {
  return typeof window.jspdf !== "undefined" && typeof window.jspdf.jsPDF === "function";
}

function ecrirePdfStructure(doc, options) {
  const titre = options.titre;
  const sousTitres = options.sousTitres || [];
  const sections = options.sections || [];
  const margeG = 14;
  const margeBas = 280;
  const largeurUtile = 210 - margeG - margeG;
  let y = 18;

  function sautDePageSiBesoin(hauteurNecessaire) {
    if (y + hauteurNecessaire > margeBas) { doc.addPage(); y = 18; }
  }

  doc.setFont("helvetica", "bold"); doc.setFontSize(16); doc.setTextColor(0);
  doc.text(titre, margeG, y); y += 8;

  doc.setFont("helvetica", "normal"); doc.setFontSize(10); doc.setTextColor(90);
  sousTitres.forEach((s) => {
    doc.splitTextToSize(s, largeurUtile).forEach((l) => { sautDePageSiBesoin(6); doc.text(l, margeG, y); y += 5; });
  });
  doc.setTextColor(0);
  y += 4;

  sections.forEach((section) => {
    sautDePageSiBesoin(10);
    doc.setFont("helvetica", "bold"); doc.setFontSize(12);
    doc.text(section.titre, margeG, y); y += 7;
    doc.setFont("helvetica", "normal"); doc.setFontSize(10);
    if (!section.lignes || !section.lignes.length) {
      sautDePageSiBesoin(6);
      doc.setTextColor(120);
      doc.text(section.texteVide || "-", margeG, y); y += 6;
      doc.setTextColor(0);
    } else {
      section.lignes.forEach((ligneTexte) => {
        doc.splitTextToSize("• " + ligneTexte, largeurUtile).forEach((l) => { sautDePageSiBesoin(6); doc.text(l, margeG, y); y += 5.5; });
      });
    }
    y += 4;
  });
}

// `nomFichier` : depose directement le PDF dans les telechargements du navigateur (doc.save). Renvoie
// false (et previent l'utilisateur) si jsPDF n'a pas pu se charger, sans jamais planter le bouton.
function genererEtTelechargerPdf(construireContenu, nomFichier) {
  if (!pdfDisponible()) { alert(t("msgPdfIndisponible")); return false; }
  const doc = new window.jspdf.jsPDF({ unit: "mm", format: "a4" });
  ecrirePdfStructure(doc, construireContenu());
  doc.save(nomFichier);
  return true;
}

// Etape 41 : tableau "ventes par article" avec, SOUS chaque article, les variantes (couleur/taille) reellement
// vendues - clic sur la ligne (ou sur la fleche) pour les deplier/replier. Utilise par le Tableau de bord
// (Top articles) et par l'onglet Rapports. `liste` : [{nom, quantite, montant, variantes:[{couleur,taille,quantite,montant}]}].
function libelleVarianteVendue(v) {
  const parts = [];
  [v.couleur, v.taille].forEach((x) => {
    const c = String(x == null ? "" : x).trim();
    if (c && c !== "-" && parts.indexOf(c) === -1) parts.push(c);
  });
  return parts.length ? parts.join(" · ") : t("libelleVarianteUnique");
}

function tableVentesParArticleHtml(liste, premiereColonne) {
  return "<table class='table-donnees table-ventes-articles'><tr><th>" + esc(premiereColonne) + "</th><th>" + t("theadQuantite") + "</th><th>" + t("theadMontantFcfa") + "</th></tr>" +
    liste.map((a, i) => {
      const vs = Array.isArray(a.variantes) ? a.variantes : [];
      const nom = vs.length
        ? "<button type='button' class='btn-deplier-ventes' data-deplier-ventes='" + i + "' title=\"" + esc(t("titreDetailVariantes")) + "\" aria-expanded='false'><span class='fleche'>▸</span></button>" + esc(a.nom)
        : esc(a.nom);
      return "<tr class='ligne-article-vendu' data-article-vendu='" + i + "'><td>" + nom + "</td><td>" + a.quantite + "</td><td>" + (a.montant || 0).toLocaleString(localeCourante()) + "</td></tr>" +
        vs.map((v) => "<tr class='ligne-detail-variante' data-detail-de='" + i + "' style='display:none;'><td>" + esc(libelleVarianteVendue(v)) + "</td><td>" + v.quantite + "</td><td>" + (v.montant || 0).toLocaleString(localeCourante()) + "</td></tr>").join("");
    }).join("") + "</table>";
}

// Les espaces fines/insecables que produit toLocaleString("fr-FR") ne s'impriment pas correctement dans les
// polices standard de jsPDF : on les remplace par une espace normale dans les PDF.
function nombrePdf(n) { return Number(n).toLocaleString(localeCourante()).replace(/[\u202f\u00a0]/g, " "); }

function brancherDeplierVentes(zone) {
  Array.prototype.forEach.call(zone.querySelectorAll("[data-deplier-ventes]"), (btn) => {
    const i = btn.dataset.deplierVentes;
    const basculer = () => {
      const ouvert = !btn.classList.contains("ouvert");
      btn.classList.toggle("ouvert", ouvert);
      btn.setAttribute("aria-expanded", ouvert ? "true" : "false");
      Array.prototype.forEach.call(zone.querySelectorAll("tr[data-detail-de='" + i + "']"), (tr) => { tr.style.display = ouvert ? "" : "none"; });
    };
    btn.onclick = (e) => { e.stopPropagation(); basculer(); };
    const ligne = zone.querySelector("tr[data-article-vendu='" + i + "']");
    if (ligne) { ligne.style.cursor = "pointer"; ligne.onclick = basculer; }
  });
}

async function renderRapports() {
  const zone = document.getElementById("contenuOnglet");
  zone.innerHTML = "<div class='chargement'>" + t("chargement") + "</div>";
  const catalogue = await api("/api/" + marchandActif.id + "/catalogue");
  const aujourdhui = new Date().toISOString().slice(0, 10);

  zone.innerHTML =
    "<h2>" + t("rapportsTitre") + "</h2>" +
    "<div class='controles-rapport'>" +
      "<div><label>" + t("labelPeriode") + "</label><select id='rapportPeriode'><option value='jour'>" + t("optionJour") + "</option><option value='semaine'>" + t("optionSemaine") + "</option><option value='mois'>" + t("optionMois") + "</option><option value='trimestre'>" + t("optionTrimestre") + "</option><option value='annee'>" + t("optionAnnee") + "</option></select></div>" +
      "<div><label>" + t("labelDateReference") + "</label><input type='date' id='rapportDate' value='" + aujourdhui + "' /></div>" +
      "<div><label>" + t("labelArticleFiltre") + "</label><select id='rapportArticle'><option value='tous'>" + t("optionTousArticles") + "</option>" +
        catalogue.map((p) => "<option value=\"" + esc(p.id) + "\">" + esc(p.nom) + "</option>").join("") +
      "</select></div>" +
      "<div><button id='btnGenererRapport' class='principal'>" + t("btnGenerer") + "</button></div>" +
      "<div><button id='btnRapportPdf'>" + t("btnTelechargerPdf") + "</button></div>" +
    "</div>" +
    "<div id='resultatRapport'></div>";

  const libellesPeriode = { jour: t("optionJour"), semaine: t("optionSemaine"), mois: t("optionMois"), trimestre: t("optionTrimestre"), annee: t("optionAnnee") };

  // Reutilise par le bouton "Generer" (affichage a l'ecran) ET par le bouton PDF (telechargement) - chacun
  // appelle lui-meme l'API avec les filtres actuellement selectionnes, sans dependre de l'autre.
  async function chargerRapport() {
    const periode = document.getElementById("rapportPeriode").value;
    const date = document.getElementById("rapportDate").value;
    const articleId = document.getElementById("rapportArticle").value;
    const r = await api("/api/" + marchandActif.id + "/rapports/commandes?periode=" + encodeURIComponent(periode) + "&date=" + encodeURIComponent(date) + "&articleId=" + encodeURIComponent(articleId));
    const nomArticle = articleId === "tous" ? t("optionTousArticles") : ((catalogue.find((p) => p.id === articleId) || {}).nom || articleId);
    return { r, periode, date, articleId, nomArticle };
  }

  document.getElementById("btnGenererRapport").onclick = async () => {
    const zoneResultat = document.getElementById("resultatRapport");
    zoneResultat.innerHTML = "<div class='chargement'>" + t("chargement") + "</div>";
    try {
      const { r } = await chargerRapport();
      zoneResultat.innerHTML =
        "<div class='tuiles'>" +
          "<div class='tuile'><div class='valeur'>" + r.nbCommandes + "</div><div class='libelle'>" + t("libelleCommandesPeriode") + "</div></div>" +
          "<div class='tuile'><div class='valeur'>" + (r.chiffreAffaires || 0).toLocaleString(localeCourante()) + " FCFA</div><div class='libelle'>" + t("libelleCaHorsAnnulees") + "</div></div>" +
        "</div>" +
        "<h3>" + t("h3RepartitionStatut") + "</h3>" +
        "<table class='table-donnees'><tr>" + Object.keys(r.parStatut).map((s) => "<th>" + esc(libelleStatutCommande(s)) + "</th>").join("") + "</tr><tr>" + Object.keys(r.parStatut).map((s) => "<td>" + r.parStatut[s] + "</td>").join("") + "</tr></table>" +
        "<h3>" + t("h3QuantitesVendues") + "</h3>" +
        (r.parArticle.length
          ? tableVentesParArticleHtml(r.parArticle, t("theadArticleCourt"))
          : "<p class='raison'>" + t("msgAucuneVentePeriode") + "</p>");
      brancherDeplierVentes(zoneResultat);
    } catch (e) { zoneResultat.innerHTML = "<div class='erreur'>" + t("erreurPrefixe") + esc(e.message) + "</div>"; }
  };

  document.getElementById("btnRapportPdf").onclick = async () => {
    try {
      const { r, periode, date, nomArticle } = await chargerRapport();
      genererEtTelechargerPdf(() => ({
        titre: t("pdfRapportTitre", { nom: marchandActif.nom }),
        sousTitres: [
          t("pdfRapportSousTitrePeriode", { periode: libellesPeriode[periode] || periode, date: date }),
          t("pdfRapportSousTitreArticle", { article: nomArticle }),
          t("pdfRapportSousTitreGenere", { date: new Date().toLocaleString(localeCourante()) })
        ],
        sections: [
          { titre: t("pdfSectionResume"), lignes: [t("pdfLigneNbCommandes", { n: r.nbCommandes }), t("pdfLigneCa", { ca: nombrePdf(r.chiffreAffaires || 0) })] },
          { titre: t("pdfSectionRepartition"), lignes: Object.keys(r.parStatut).map((s) => libelleStatutCommande(s) + " : " + r.parStatut[s]) },
          { titre: t("pdfSectionQuantites"), lignes: [].concat.apply([], r.parArticle.map((a) => [a.nom + " : " + a.quantite + " (" + nombrePdf(a.montant || 0) + " FCFA)"].concat((a.variantes || []).map((v) => "     - " + libelleVarianteVendue(v) + " : " + v.quantite + " (" + nombrePdf(v.montant || 0) + " FCFA)")))), texteVide: t("pdfTexteAucuneVente") }
        ]
      }), "rapport-commandes-" + marchandActif.id + "-" + date + ".pdf");
    } catch (e) { alert(t("erreurPrefixe") + e.message); }
  };
}

// Onglet "Inventaire" (instantanés de stock) : separe de l'onglet "Rapports" depuis le 25 septembre 2026
// (voir renderRapports ci-dessus).
async function renderInventaire() {
  const zone = document.getElementById("contenuOnglet");
  zone.innerHTML = "<div class='chargement'>" + t("chargement") + "</div>";
  const instantanes = await api("/api/" + marchandActif.id + "/inventaire/instantanes");

  // Bouton "Supprimer" reserve au propriétaire du marchand/super-administrateur (voir server.js) - un
  // employé ayant le rôle "inventaire" voit toujours la liste complete (y compris les instantanés deja
  // supprimés, avec leur mention "Supprimé le ... par ...") mais jamais le bouton lui-même. DOIT rester
  // déclaré AVANT l'appel à rendreListeInstantanes(...) juste en dessous (qui l'utilise immédiatement) -
  // une erreur de ce genre (variable const utilisée avant sa ligne de déclaration) plante tout l'onglet.
  const estGestionnaire = moi.role === "marchand" || moi.role === "superadmin";

  zone.innerHTML =
    "<h2>" + t("h3InstantanesInventaire") + "</h2>" +
    "<p class='raison'>" + t("noteInstantanes") + "</p>" +
    "<button id='btnNouvelInstantane'>" + t("btnNouvelInstantane") + "</button> " +
    "<button id='btnStockActuelPdf'>" + t("btnTelechargerStockActuelPdf") + "</button>" +
    "<div id='listeInstantanes' style='margin-top:14px;'>" + rendreListeInstantanes(instantanes) + "</div>";

  document.getElementById("btnStockActuelPdf").onclick = async () => {
    try {
      const lignes = await api("/api/" + marchandActif.id + "/inventaire/actuel");
      genererEtTelechargerPdf(() => ({
        titre: t("pdfStockActuelTitre", { marchand: marchandActif.nom }),
        sousTitres: [t("pdfRapportSousTitreGenere", { date: new Date().toLocaleString(localeCourante()) })],
        sections: [{
          titre: t("pdfSectionArticles"),
          lignes: lignes.map((l) => t("pdfLigneArticle", { produit: l.produit, couleur: l.couleur, taille: l.taille, stock: l.stockReel, prix: (l.prix || 0).toLocaleString(localeCourante()) })),
          texteVide: t("pdfTexteAucunArticle")
        }]
      }), "stock-actuel-" + marchandActif.id + ".pdf");
    } catch (e) { alert(t("erreurPrefixe") + e.message); }
  };

  function rendreListeInstantanes(liste) {
    if (!liste.length) return "<p class='raison'>" + t("msgAucunInstantane") + "</p>";
    return "<table class='table-donnees'><tr><th>" + t("theadNom") + "</th><th>" + t("theadDateCourt") + "</th><th>" + t("theadLignes") + "</th><th></th></tr>" +
      liste.slice().reverse().map((s) => {
        const supprime = !!s.supprimeLe;
        let colonneAction = "<button data-voir-instantane='" + esc(s.id) + "'>" + t("voir") + "</button> " +
          "<button data-pdf-instantane='" + esc(s.id) + "'>" + t("btnTelechargerPdf") + "</button>";
        if (supprime) {
          colonneAction += " <span class='raison'>" + esc(t("labelSupprimeLePar", { date: new Date(s.supprimeLe).toLocaleString(localeCourante()), qui: s.supprimePar || "?" })) + "</span>";
        } else if (estGestionnaire) {
          colonneAction += " <button data-suppr-instantane='" + esc(s.id) + "' class='danger'>" + t("supprimer") + "</button>";
        }
        return "<tr" + (supprime ? " style='opacity:0.6;'" : "") + "><td>" + esc(s.nom) + "</td><td>" + esc(new Date(s.dateISO).toLocaleString(localeCourante())) + "</td><td>" + s.lignes.length + t("suffixeVariantes") + "</td>" +
          "<td>" + colonneAction + "</td></tr>";
      }).join("") + "</table><div id='detailInstantane'></div>";
  }

  function brancherActionsInstantanes(liste) {
    Array.prototype.forEach.call(zone.querySelectorAll("[data-voir-instantane]"), (btn) => {
      btn.onclick = () => {
        const s = liste.filter((x) => x.id === btn.dataset.voirInstantane)[0];
        if (!s) return;
        document.getElementById("detailInstantane").innerHTML =
          "<h3>" + esc(s.nom) + " — " + esc(new Date(s.dateISO).toLocaleString(localeCourante())) + "</h3>" +
          "<table class='table-donnees'><tr><th>" + t("theadArticleCourt") + "</th><th>" + t("theadCouleur") + "</th><th>" + t("theadTaille") + "</th><th>" + t("theadStockReel") + "</th><th>" + t("theadPrix") + "</th></tr>" +
          s.lignes.map((l) => "<tr><td>" + esc(l.produit) + "</td><td>" + esc(l.couleur) + "</td><td>" + esc(l.taille) + "</td><td>" + l.stockReel + "</td><td>" + (l.prix || 0).toLocaleString(localeCourante()) + " FCFA</td></tr>").join("") +
          "</table>";
      };
    });
    Array.prototype.forEach.call(zone.querySelectorAll("[data-pdf-instantane]"), (btn) => {
      btn.onclick = () => {
        const s = liste.filter((x) => x.id === btn.dataset.pdfInstantane)[0];
        if (!s) return;
        const sousTitres = [t("pdfInventaireSousTitreEnregistre", { marchand: marchandActif.nom, date: new Date(s.dateISO).toLocaleString(localeCourante()) })];
        if (s.supprimeLe) sousTitres.push(t("pdfInventaireSousTitreSupprime", { date: new Date(s.supprimeLe).toLocaleString(localeCourante()), qui: s.supprimePar || "?" }));
        genererEtTelechargerPdf(() => ({
          titre: t("pdfInventaireTitre", { nom: s.nom }),
          sousTitres: sousTitres,
          sections: [{
            titre: t("pdfSectionArticles"),
            lignes: s.lignes.map((l) => t("pdfLigneArticle", { produit: l.produit, couleur: l.couleur, taille: l.taille, stock: l.stockReel, prix: (l.prix || 0).toLocaleString(localeCourante()) })),
            texteVide: t("pdfTexteAucunArticle")
          }]
        }), "instantane-" + s.id + ".pdf");
      };
    });
    Array.prototype.forEach.call(zone.querySelectorAll("[data-suppr-instantane]"), (btn) => {
      btn.onclick = async () => {
        if (!confirm(t("confirmSupprimerInstantane"))) return;
        try {
          await api("/api/" + marchandActif.id + "/inventaire/instantanes/" + encodeURIComponent(btn.dataset.supprInstantane), { method: "DELETE" });
          renderInventaire();
        } catch (e) { alert(t("erreurPrefixe") + e.message); }
      };
    });
  }
  brancherActionsInstantanes(instantanes);

  document.getElementById("btnNouvelInstantane").onclick = async () => {
    const nom = prompt(t("promptNomInstantane"), t("prefixeInstantaneDu") + new Date().toLocaleDateString(localeCourante()));
    if (nom === null) return;
    try {
      await api("/api/" + marchandActif.id + "/inventaire/instantanes", { method: "POST", body: JSON.stringify({ nom }) });
      renderInventaire();
    } catch (e) { alert(t("erreurPrefixe") + e.message); }
  };
}

function blocLogoHtml() {

          t("labelFiligraneLogo") +

function brancherBlocLogo() {
  document.getElementById("btnUploaderLogo").onclick = async () => {
    const fichier = document.getElementById("champLogo").files[0];
    if (!fichier) { alert(t("alertChoisirImage")); return; }
    const donnees = new FormData();
    donnees.append("logo", fichier);
    try {
      await fetch("/api/marchands/" + marchandActif.id + "/logo", { method: "POST", body: donnees })
        .then(async (r) => { if (!r.ok) { const j = await r.json().catch(() => ({})); throw new Error(j.erreur || r.statusText); } });
      await demarrer();
    } catch (e) { alert(t("erreurPrefixe") + e.message); }
  };
  const btnSuppr = document.getElementById("btnSupprimerLogo");
  if (btnSuppr) btnSuppr.onclick = async () => {
    if (!confirm(t("confirmSupprimerLogo"))) return;
    try {
      await api("/api/marchands/" + marchandActif.id + "/logo", { method: "DELETE" });
      await demarrer();
    } catch (e) { alert(t("erreurPrefixe") + e.message); }
  };
  // Case "filigrane" (absente du HTML tant qu'il n'y a pas de logo, voir blocLogoHtml ci-dessus) -
  // enregistrement immediat au changement, sans bouton "Enregistrer" separe : le filigrane apparaissant ou
  // disparaissant tout de suite sous les yeux du marchand EST la confirmation, pas besoin d'une alerte en
  // plus. Pas de rechargement complet (demarrer()) pour rester sur le marchand/l'onglet en cours.
  const champFiligrane = document.getElementById("champFiligraneLogo");
  if (champFiligrane) champFiligrane.onchange = async () => {
    const valeur = champFiligrane.checked;
    try {
      await api("/api/" + marchandActif.id + "/filigrane-logo", { method: "PUT", body: JSON.stringify({ filigraneLogoActif: valeur }) });
      marchandActif.filigraneLogoActif = valeur;
      appliquerFiligraneLogo();
    } catch (e) {
      champFiligrane.checked = !valeur;
      alert(t("erreurPrefixe") + e.message);
    }
  };
}

// ---------------- QR code WhatsApp par marchand (Etape 42) ----------------
// Un QR code = le lien wa.me du marchand (https://wa.me/<numero>?text=<message>). Genere ENTIEREMENT cote
// navigateur (bibliotheque embarquee plus haut) : aucune route serveur, aucun envoi de donnees. Disponible
// pour tous les marchands (pas une option payante) ; visible uniquement du proprietaire et du superadmin
// puisque l'onglet Mon compte des employes ne contient pas ce bloc. Le seul appel serveur est
// l'enregistrement (optionnel) du numero via PUT /api/:id/numero-whatsapp-public, deja protege.
function qrChiffres(v) { return (v || "").replace(/[^0-9]/g, ""); }
function qrLienCourant() {
  const champN = document.getElementById("champQrNumero");
  const champM = document.getElementById("champQrMessage");
  const n = qrChiffres(champN ? champN.value : marchandActif.numeroWhatsappPublic);
  if (n.length < 8) return null;
  const m = (champM ? champM.value : "").trim();
  return "https://wa.me/" + n + (m ? "?text=" + encodeURIComponent(m) : "");
}
function qrMatrice(lien, avecLogo) {
  // Niveau H (~30 % de donnees recuperables) uniquement quand un logo masque le centre ; M sinon (QR plus aere).
  const q = qrcode(0, avecLogo ? "H" : "M");
  q.addData(lien);
  q.make();
  return q;
}
// Le logo (fond blanc inclus) occupe au plus QR_LOGO_BOITE de la largeur des modules, le logo lui-meme
// QR_LOGO_IMAGE : bien en dessous de la capacite de correction du niveau H, centre pris sur des modules de donnees
// uniquement (jamais sur les 3 reperes d'angle).
const QR_LOGO_BOITE = 0.24, QR_LOGO_IMAGE = 0.20;
function qrDimensionsLogo(logo, largeur) {
  const ratio = logo.w / logo.h;
  const max = largeur * QR_LOGO_IMAGE;
  let w = max, h = max;
  if (ratio >= 1) h = max / ratio; else w = max * ratio;
  return { w, h, boite: largeur * QR_LOGO_BOITE };
}
function qrDessinerCanvas(canvas, lien, taille, logo) {
  const q = qrMatrice(lien, !!logo);
  const n = q.getModuleCount();
  const marge = 4;
  const px = Math.max(1, Math.floor(taille / (n + 2 * marge)));
  const total = px * (n + 2 * marge);
  canvas.width = total; canvas.height = total;
  const c = canvas.getContext("2d");
  c.fillStyle = "#ffffff"; c.fillRect(0, 0, total, total);
  c.fillStyle = "#000000";
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) {
    if (q.isDark(r, k)) c.fillRect((k + marge) * px, (r + marge) * px, px, px);
  }
  if (logo) {
    const d = qrDimensionsLogo(logo, n * px);
    const cx = total / 2, cy = total / 2;
    c.fillStyle = "#ffffff"; c.fillRect(cx - d.boite / 2, cy - d.boite / 2, d.boite, d.boite);
    c.drawImage(logo.img, cx - d.w / 2, cy - d.h / 2, d.w, d.h);
  }
}
function qrNomFichier(ext) {
  const base = (marchandActif.nom || "boutique").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-+|-+$/g, "") || "boutique";
  return "qr-whatsapp-" + base + "." + ext;
}
function qrTelecharger(blob, nom) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = nom;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 2000);
}
let qrLogoCache = { url: null, promesse: null };
function qrChargerLogo() {
  const url = marchandActif.logoUrl || null;
  if (qrLogoCache.url === url && qrLogoCache.promesse) return qrLogoCache.promesse;
  qrLogoCache = { url, promesse: qrChargerLogoSansCache() };
  return qrLogoCache.promesse;
}
function qrChargerLogoSansCache() {
  return new Promise((resolve) => {
    if (!marchandActif.logoUrl) return resolve(null);
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => {
      try {
        const c = document.createElement("canvas");
        c.width = img.naturalWidth; c.height = img.naturalHeight;
        c.getContext("2d").drawImage(img, 0, 0);
        resolve({ img, data: c.toDataURL("image/png"), w: img.naturalWidth, h: img.naturalHeight });
      } catch (e) { resolve(null); }
    };
    // Le logo est sur un autre domaine (Cloudflare R2) sans CORS : un canvas ne peut pas le recopier directement
    // (il deviendrait "tainted"). On le charge donc d'abord via le relais same-origin du serveur, et seulement
    // en repli en direct (au cas ou le bucket aurait du CORS).
    let essaiDirect = false;
    img.onerror = () => {
      if (!essaiDirect) { essaiDirect = true; img.src = marchandActif.logoUrl; } else resolve(null);
    };
    img.src = "/api/marchands/" + encodeURIComponent(marchandActif.id) + "/logo-image?v=" + encodeURIComponent(marchandActif.logoUrl);
  });
}
async function qrGenererAffichePdf(lien, logoCentre) {
  const doc = new window.jspdf.jsPDF({ unit: "mm", format: "a5" });
  const L = 148, H = 210;
  let y = 16;
  // Logo deja au centre du QR : on ne le repete pas en haut de l'affiche.
  const logo = logoCentre ? null : await qrChargerLogo();
  if (logo && logo.w && logo.h) {
    const hMax = 24, wMax = 70;
    let h = hMax, w = hMax * logo.w / logo.h;
    if (w > wMax) { w = wMax; h = wMax * logo.h / logo.w; }
    try { doc.addImage(logo.data, "PNG", (L - w) / 2, y, w, h); y += h + 8; } catch (e) { /* logo ignore */ }
  }
  doc.setFont("helvetica", "bold"); doc.setFontSize(22); doc.setTextColor(20, 20, 20);
  const nomLignes = doc.splitTextToSize(marchandActif.nom || "", L - 24);
  doc.text(nomLignes, L / 2, y + 8, { align: "center" });
  y += 8 + nomLignes.length * 9 + 4;
  const q = qrMatrice(lien, !!logoCentre);
  const n = q.getModuleCount();
  const marge = 4;
  const cote = 100;
  const mod = cote / (n + 2 * marge);
  const x0 = (L - cote) / 2;
  doc.setFillColor(0, 0, 0);
  for (let r = 0; r < n; r++) for (let k = 0; k < n; k++) {
    if (q.isDark(r, k)) doc.rect(x0 + (k + marge) * mod, y + (r + marge) * mod, mod + 0.02, mod + 0.02, "F");
  }
  if (logoCentre) {
    const d = qrDimensionsLogo(logoCentre, n * mod);
    const cx = x0 + cote / 2, cy = y + cote / 2;
    doc.setFillColor(255, 255, 255); doc.rect(cx - d.boite / 2, cy - d.boite / 2, d.boite, d.boite, "F");
    try { doc.addImage(logoCentre.data, "PNG", cx - d.w / 2, cy - d.h / 2, d.w, d.h); } catch (e) { /* logo ignore */ }
  }
  doc.setDrawColor(200, 200, 200); doc.rect(x0, y, cote, cote);
  y += cote + 12;
  doc.setFont("helvetica", "bold"); doc.setFontSize(15); doc.setTextColor(20, 20, 20);
  doc.text(doc.splitTextToSize(t("pdfQrScanner"), L - 24), L / 2, y, { align: "center" });
  y += 11;
  doc.setFont("helvetica", "normal"); doc.setFontSize(13);
  doc.text("+" + qrChiffres(document.getElementById("champQrNumero").value), L / 2, y, { align: "center" });
  doc.setFontSize(9); doc.setTextColor(120, 120, 120);
  doc.text(t("pdfQrPropulse"), L / 2, H - 10, { align: "center" });
  doc.save(qrNomFichier("pdf"));
}

  const c = document.getElementById("champQrLogo");

function brancherBlocQr() {
  const canvas = document.getElementById("canvasQr");
  const note = document.getElementById("noteQr");
  const boutons = ["btnQrPng", "btnQrPdf", "btnQrCopier"].map((id) => document.getElementById(id));
  let jeton = 0;
  async function rafraichir() {
    const moi_ = ++jeton;
    const lien = qrLienCourant();
    note.style.display = lien ? "none" : "";
    canvas.style.display = lien ? "" : "none";
    boutons.forEach((b) => { b.disabled = !lien; });
    if (!lien) return;

    qrDessinerCanvas(canvas, lien, 480, logo);

    if (alerteLogo) alerteLogo.style.display = (document.getElementById("champQrLogo").checked && !logo) ? "" : "none";

  document.getElementById("champQrNumero").oninput = rafraichir;
  document.getElementById("champQrMessage").oninput = rafraichir;
  const caseLogo = document.getElementById("champQrLogo");
  if (caseLogo) caseLogo.onchange = rafraichir;
  document.getElementById("btnQrSauverNumero").onclick = async () => {
    const valeur = document.getElementById("champQrNumero").value.trim() || null;
    try {
      await api("/api/" + marchandActif.id + "/numero-whatsapp-public", { method: "PUT", body: JSON.stringify({ numeroWhatsappPublic: valeur }) });
      marchandActif.numeroWhatsappPublic = valeur;
      alert(t("alertNumeroPublicEnregistre"));
    } catch (e) { alert(t("erreurPrefixe") + e.message); }
  };
  document.getElementById("btnQrPng").onclick = async () => {
    const lien = qrLienCourant(); if (!lien) return;
    const c = document.createElement("canvas");
    qrDessinerCanvas(c, lien, 1000, await qrLogoActif());
    c.toBlob((blob) => { if (blob) qrTelecharger(blob, qrNomFichier("png")); }, "image/png");
  };
  document.getElementById("btnQrPdf").onclick = async () => {
    const lien = qrLienCourant(); if (!lien) return;
    if (!pdfDisponible()) { alert(t("alertQrPdfIndispo")); return; }
    try { await qrGenererAffichePdf(lien, await qrLogoActif()); } catch (e) { alert(t("erreurPrefixe") + e.message); }
  };
  document.getElementById("btnQrCopier").onclick = async () => {
    const lien = qrLienCourant(); if (!lien) return;
    try { await navigator.clipboard.writeText(lien); alert(t("alertQrCopie")); }
    catch (e) { window.prompt(t("btnQrCopier"), lien); }
  };
  rafraichir();
}

      "<label>" + t("labelNomUtilisateur") + "</label>" +
      "<input id='champUtilisateur' value=\"" + esc(marchandActif.adminUser || "") + "\" />" +
      "<div style='margin-top:10px;'><button id='btnSauverUtilisateur'>" + t("btnEnregistrerNomUtilisateur") + "</button></div>" +
      "<h3>" + t("h3MotDePasse") + "</h3>" +
      "<label>" + t("labelDefinirMdp") + "</label>" +
      "<input id='champNouveauMdp' type='text' placeholder=\"" + esc(t("placeholderNouveauMdp")) + "\" />" +
      "<div style='margin-top:10px;'>" +
        "<button id='btnDefinirMdp' class='principal'>" + t("btnDefinirMdp") + "</button> " +
        "<button id='btnGenererMdp'>" + t("btnGenererMdp") + "</button>" +
      "</div>" +
      "<h3>" + t("h3NumeroNotification") + "</h3>" +
      "<p class='raison'>" + t("noteNumeroNotifSuperadmin") + "</p>" +
      "<label>" + t("labelNumeroNotif") + "</label>" +
      "<input id='champNotification' value=\"" + esc(marchandActif.phoneNotification || "") + "\" />" +
      "<div style='margin-top:10px;'><button id='btnSauverNotification' class='principal'>" + t("enregistrer") + "</button></div>" +
      blocTesterAlerteHtml() +
      (marchandActif.optionLienCommande ? blocNumeroPublicHtml() : "") +
      blocLogoHtml() +
      blocImageAccueilWhatsappHtml() +
      blocQrHtml();
    brancherBlocOptionsPayantes();
    brancherBlocTesterAlerte();
    if (marchandActif.optionLienCommande) brancherBlocNumeroPublic();
    brancherBlocLogo();
    brancherBlocImageAccueilWhatsapp();
    brancherBlocQr();

    document.getElementById("btnSauverUtilisateur").onclick = async () => {
      const nouvUtilisateur = document.getElementById("champUtilisateur").value.trim();
      if (!nouvUtilisateur) { alert(t("alertNomUtilisateurVide")); return; }
      try {
        await api("/api/" + marchandActif.id + "/identifiants", { method: "PUT", body: JSON.stringify({ adminUser: nouvUtilisateur }) });
        alert(t("alertNomUtilisateurMaj"));
        await demarrer();
      } catch (e) { alert(t("erreurPrefixe") + e.message); }
    };
    document.getElementById("btnDefinirMdp").onclick = async () => {
      const mdp = document.getElementById("champNouveauMdp").value;
      if (!mdp) { alert(t("alertEntrerMdp")); return; }
      try {
        await api("/api/" + marchandActif.id + "/identifiants", { method: "PUT", body: JSON.stringify({ newPassword: mdp }) });
        alert(t("alertMdpMajCommuniquer", { mdp: mdp }));
      } catch (e) { alert(t("erreurPrefixe") + e.message); }
    };
    document.getElementById("btnGenererMdp").onclick = async () => {
      try {
        const rep = await api("/api/" + marchandActif.id + "/identifiants", { method: "PUT", body: JSON.stringify({ genererMotDePasse: true }) });
        alert(t("alertNouveauMdpGenereCommuniquer", { mdp: rep.nouveauMotDePasse }));
      } catch (e) { alert(t("erreurPrefixe") + e.message); }
    };
    document.getElementById("btnSauverNotification").onclick = async () => {
      try {
        await api("/api/" + marchandActif.id + "/notification", { method: "PUT", body: JSON.stringify({ phoneNotification: document.getElementById("champNotification").value.trim() || null }) });
        alert(t("alertNumeroNotifEnregistre"));
        await demarrer();
      } catch (e) { alert(t("erreurPrefixe") + e.message); }
    };
    return;
  }

  // Vue "employe" : identifiant en lecture seule, ses acces, et changement de son propre mot de passe
  // uniquement (jamais son nom ni ses rôles — seul le propriétaire du marchand peut les changer, voir
  // l'onglet "Employés").
  if (moi.role === "employe") {
    const libellesRoles = rolesDisponibles();
    const mesAcces = (moi.roles || []).map((r) => { const trouve = libellesRoles.filter((x) => x[0] === r)[0]; return trouve ? trouve[1] : r; });
    zone.innerHTML =
      "<h2>" + t("monCompteTitre") + "</h2>" +
      "<p>" + t("labelNomUtilisateurAffiche") + "<strong>" + esc(moi.adminUser || "") + "</strong></p>" +
      "<p>" + t("labelAcces") + "<strong>" + (mesAcces.length ? esc(mesAcces.join(", ")) : t("aucun")) + "</strong></p>" +
      "<label>" + t("labelNouveauMdp") + "</label>" +
      "<input id='champNouveauMdp1' type='password' />" +
      "<label>" + t("labelConfirmerMdp") + "</label>" +
      "<input id='champNouveauMdp2' type='password' />" +
      "<div style='margin-top:14px;'><button id='btnChangerMdp' class='principal'>" + t("btnChangerMdp") + "</button></div>" +
      "<p class='raison'>" + t("noteRechargementMdp") + "</p>";
    document.getElementById("btnChangerMdp").onclick = async () => {
      const m1 = document.getElementById("champNouveauMdp1").value;
      const m2 = document.getElementById("champNouveauMdp2").value;
      if (!m1 || m1 !== m2) { alert(t("alertMdpIdentiques")); return; }
      if (m1.length < 6) { alert(t("alertMdp6Caracteres")); return; }
      try {
        await api("/api/" + marchandActif.id + "/employes/" + moi.employeId, { method: "PUT", body: JSON.stringify({ newPassword: m1 }) });
        alert(t("alertMdpChangeSucces"));
        location.reload();
      } catch (e) { alert(t("erreurPrefixe") + e.message); }
    };
    return;
  }

  // Vue "marchand" : uniquement son propre changement de mot de passe.
  zone.innerHTML =
    "<h2>" + t("monCompteTitre") + "</h2>" +
    "<p>" + t("labelNomUtilisateurAffiche") + "<strong>" + esc(marchandActif.adminUser || "") + "</strong></p>" +
    "<label>" + t("labelNouveauMdp") + "</label>" +
    "<input id='champNouveauMdp1' type='password' />" +
    "<label>" + t("labelConfirmerMdp") + "</label>" +
    "<input id='champNouveauMdp2' type='password' />" +
    "<div style='margin-top:14px;'><button id='btnChangerMdp' class='principal'>" + t("btnChangerMdp") + "</button></div>" +
    "<p class='raison'>" + t("noteRechargementMdp") + "</p>" +
    "<h3>" + t("h3NumeroNotification") + "</h3>" +
    "<p class='raison'>" + t("noteNumeroNotifMarchand") + "</p>" +
    "<label>" + t("labelNumeroNotif") + "</label>" +
    "<input id='champNotification' value=\"" + esc(marchandActif.phoneNotification || "") + "\" />" +
    "<div style='margin-top:10px;'><button id='btnSauverNotification' class='principal'>" + t("enregistrer") + "</button></div>" +
    blocTesterAlerteHtml() +
    (marchandActif.optionLienCommande ? blocNumeroPublicHtml() : "") +
    blocLogoHtml() +
    blocImageAccueilWhatsappHtml() +
    blocQrHtml();
  brancherBlocTesterAlerte();
  if (marchandActif.optionLienCommande) brancherBlocNumeroPublic();
  brancherBlocLogo();
  brancherBlocImageAccueilWhatsapp();
  brancherBlocQr();

  document.getElementById("btnChangerMdp").onclick = async () => {
    const m1 = document.getElementById("champNouveauMdp1").value;
    const m2 = document.getElementById("champNouveauMdp2").value;
    if (!m1 || m1 !== m2) { alert(t("alertMdpIdentiques")); return; }
    if (m1.length < 6) { alert(t("alertMdp6Caracteres")); return; }
    try {
      await api("/api/" + marchandActif.id + "/identifiants", { method: "PUT", body: JSON.stringify({ newPassword: m1 }) });
      alert(t("alertMdpChangeSucces"));
      location.reload();
    } catch (e) { alert(t("erreurPrefixe") + e.message); }
  };
  document.getElementById("btnSauverNotification").onclick = async () => {
    try {
      await api("/api/" + marchandActif.id + "/notification", { method: "PUT", body: JSON.stringify({ phoneNotification: document.getElementById("champNotification").value.trim() || null }) });
      alert(t("alertNumeroNotifEnregistre"));
    } catch (e) { alert(t("erreurPrefixe") + e.message); }
  };
}

// ---------------- Employés (comptes à accès restreint) ----------------
// Reservé au propriétaire du marchand et au super-administrateur (voir construireOnglets, permission
// "gestion") — un employé ne voit jamais cet onglet, quels que soient ses accès.

// ---------------------------------------------------------------------------------------------------------
// Onglet "Journal" (Etape 40) - modifications + connexions. Onglet "gestion" : proprietaire du marchand et
// super-administrateur UNIQUEMENT (jamais un employe : voir construireOnglets et les routes /journal du
// serveur, qui re-verifient de leur cote). Le super-administrateur peut en plus basculer sur la vue globale.
// ---------------------------------------------------------------------------------------------------------
let journalOnglet = "modifications";
let journalPerimetre = "marchand";

function libelleRoleJournal(role) {
  return role === "superadmin" ? t("jRoleSuperadmin") : role === "marchand" ? t("jRoleMarchand") : role === "employe" ? t("jRoleEmploye") : "";
}

function detailJournalHtml(ligne) {
  let d = null;
  try { d = ligne.detail ? JSON.parse(ligne.detail) : null; } catch (e) { d = null; }
  if (!d) return "";
  const out = [];
  if (Array.isArray(d.changes)) {
    d.changes.forEach((c) => {
      const base = { art: esc(c.art), v: esc(c.v), champ: esc(c.champ), de: esc(c.de), a: esc(c.a), aj: c.ajoutees || 0, ret: c.retirees || 0 };
      const cle = { article_ajoute: "jcArticleAjoute", article_supprime: "jcArticleSupprime", champ: "jcChamp", variante_ajoutee: "jcVarianteAjoutee",
        variante_supprimee: "jcVarianteSupprimee", variante_champ: "jcVarianteChamp", photos: "jcPhotos" }[c.k];
      if (cle) out.push(t(cle, base));
    });
    if (d.plus) out.push(t("jcPlus", { n: d.plus }));
  }
  if (d.art && !Array.isArray(d.changes)) out.push(t("jdPhoto", { art: esc(d.art) }));
  if (d.commande) out.push(t("jdCommande", { c: esc(d.commande), s: esc(d.statut || "") }));
  if (d.rendezvous) out.push(esc(d.rendezvous) + " → " + esc(d.statut || ""));
  if (d.employe) out.push(t("jdEmploye", { e: esc(d.employe) }));
  if (Array.isArray(d.roles) && d.roles.length) out.push(t("jdRoles", { r: esc(d.roles.join(", ")) }));
  if (d.motDePasse === true) out.push(t("jdMotDePasseChange"));
  if (Array.isArray(d.champs) && d.champs.length) out.push(t("jdChamps", { c: esc(d.champs.join(", ")) }));
  if (d.fichier) out.push(t("jdFichier", { f: esc(d.fichier) }));
  if (d.cible) out.push(t("jdCible", { c: esc(d.cible) }));
  if (d.telephone) out.push(t("jdTelephone", { t: esc(d.telephone) }));
  if (d.lignes != null) out.push(t("jdLignes", { n: d.lignes }));
  return out.map((x) => "<div>" + x + "</div>").join("");
}

async function renderJournal() {
  const zone = document.getElementById("contenuOnglet");
  const estSuper = moi.role === "superadmin";
  if (!estSuper) journalPerimetre = "marchand";
  let lignes = [];
  let suivant = null;

  function statutHtml(s) {
    const cle = s === "refuse" ? "jStatutRefuse" : s === "echec" ? "jStatutEchec" : "jStatutOk";
    return "<span class='j-statut-" + esc(s || "ok") + "'>" + t(cle) + "</span>";
  }

  function dessiner() {
    const global = estSuper && journalPerimetre === "global";
    zone.innerHTML =
      "<h2>" + t("titreJournal") + "</h2>" +
      "<p class='raison'>" + t("noteJournal") + "</p>" +
      "<div class='journal-barre'>" +
        "<button data-j-onglet='modifications' class='" + (journalOnglet === "modifications" ? "actif" : "") + "'>" + t("jSousModifications") + "</button>" +
        "<button data-j-onglet='connexions' class='" + (journalOnglet === "connexions" ? "actif" : "") + "'>" + t("jSousConnexions") + "</button>" +
        (estSuper ? "<select id='journalPerimetre'><option value='marchand'" + (global ? "" : " selected") + ">" + t("jPerimetreMarchand") + "</option><option value='global'" + (global ? " selected" : "") + ">" + t("jPerimetreTous") + "</option></select>" : "") +
      "</div>" +
      (lignes.length
        ? "<table class='table-journal'><thead><tr><th>" + t("jColQuand") + "</th>" + (global ? "<th>" + t("jColMarchand") + "</th>" : "") +
          "<th>" + t("jColQui") + "</th><th>" + t("jColAction") + "</th><th>" + t("jColDetail") + "</th><th>" + t("jColIp") + "</th><th>" + t("jColAppareil") + "</th></tr></thead><tbody>" +
          lignes.map((l) =>
            "<tr data-journal-ligne='" + esc(l.action) + "'><td>" + esc(new Date(l.horodatageISO).toLocaleString(localeCourante())) + "</td>" +
            (global ? "<td>" + esc(l.marchandNom || l.merchantKey || t("jInconnu")) + "</td>" : "") +
            "<td>" + esc(l.acteurNom || t("jInconnu")) + (l.acteurRole ? "<br><span class='raison'>" + esc(libelleRoleJournal(l.acteurRole)) + "</span>" : "") + "</td>" +
            "<td>" + esc(t("act_" + l.action)) + "<br>" + statutHtml(l.statut) + "</td>" +
            "<td class='j-detail'>" + detailJournalHtml(l) + "</td>" +
            "<td>" + esc(l.ip || "") + "</td><td class='j-ua'>" + esc(l.userAgent || "") + "</td></tr>"
          ).join("") + "</tbody></table>"
        : "<p>" + t("jVide") + "</p>") +
      (suivant ? "<p><button id='btnJournalPlus'>" + t("jPlus") + "</button></p>" : "");
    Array.prototype.forEach.call(zone.querySelectorAll("[data-j-onglet]"), (b) => {
      b.onclick = () => { journalOnglet = b.dataset.jOnglet; charger(false); };
    });
    const sel = document.getElementById("journalPerimetre");
    if (sel) sel.onchange = () => { journalPerimetre = sel.value; charger(false); };
    const plus = document.getElementById("btnJournalPlus");
    if (plus) plus.onclick = () => charger(true);
  }

  async function charger(suite) {
    const type = journalOnglet === "connexions" ? "connexions" : "modifications";
    const global = estSuper && journalPerimetre === "global";
    const url = global
      ? "/api/journal/global?type=" + (type === "connexions" ? "connexion" : "modification")
      : "/api/" + marchandActif.id + "/journal/" + type + "?";
    try {
      const rep = await api(url + (suite && suivant ? "&avant=" + suivant : ""));
      lignes = suite ? lignes.concat(rep.lignes || []) : (rep.lignes || []);
      suivant = rep.suivant || null;
      dessiner();
    } catch (e) {
      zone.innerHTML = "<div class='erreur'>" + t("jChargementErreur") + "</div>";
    }
  }

  zone.innerHTML = "<div class='chargement'>" + t("chargement") + "</div>";
  await charger(false);
}

async function renderEmployes() {
  const zone = document.getElementById("contenuOnglet");
  zone.innerHTML = "<div class='chargement'>" + t("chargement") + "</div>";
  const employes = await api("/api/" + marchandActif.id + "/employes");
  const roles = rolesDisponibles();

  function casesRoles(prefixe, rolesActuels) {
    return roles.map(([cle, libelle]) =>
      "<label style='display:block;font-weight:400;margin:2px 0;'>" +
        "<input type='checkbox' data-role-prefixe='" + prefixe + "' data-role-cle='" + cle + "'" + ((rolesActuels || []).indexOf(cle) !== -1 ? " checked" : "") + " /> " + esc(libelle) +
      "</label>"
    ).join("");
  }

  function rolesCoches(prefixe) {
    return roles.map(([cle]) => cle).filter((cle) =>
      zone.querySelector("[data-role-prefixe='" + prefixe + "'][data-role-cle='" + cle + "']").checked
    );
  }

  function redraw() {
    zone.innerHTML =
      "<h2>" + t("employesTitre", { n: employes.length }) + "</h2>" +
      "<p class='raison'>" + t("noteEmployes") + "</p>" +
      (employes.length ? employes.map((e) =>
        "<div class='carte-produit'>" +
          "<div class='ligne-produit'>" +
            "<input data-emp='" + e.id + "' data-champ='nom' value=\"" + esc(e.nom) + "\" placeholder=\"" + esc(t("labelNom")) + "\" />" +
            "<span class='raison' style='align-self:center;'>" + t("labelIdentifiantNonModifiable", { id: esc(e.identifiant) }) + "</span>" +
          "</div>" +
          "<div>" + casesRoles(e.id, e.roles) + "</div>" +
          "<div style='margin-top:8px;'>" +
            "<button data-emp-sauver='" + e.id + "'>" + t("enregistrer") + "</button> " +
            "<button data-emp-mdp='" + e.id + "'>" + t("btnGenererNouveauMdp") + "</button> " +
            "<button data-emp-suppr='" + e.id + "' class='danger'>" + t("supprimer") + "</button>" +
          "</div>" +
        "</div>"
      ).join("") : "<p>" + t("aucunEmploye") + "</p>") +
      "<h3>" + t("h3AjouterEmploye") + "</h3>" +
      "<label>" + t("labelNom") + "</label><input id='nouvEmpNom' placeholder=\"" + esc(t("placeholderNomEmploye")) + "\" />" +
      "<label>" + t("labelIdentifiantConnexion") + "</label><input id='nouvEmpIdentifiant' placeholder=\"" + esc(t("placeholderIdentifiantUnique")) + "\" />" +
      "<label>" + t("labelMdpInitial") + "</label><input id='nouvEmpMdp' type='text' placeholder=\"" + esc(t("placeholderMdp")) + "\" />" +
      "<label>" + t("labelAcces") + "</label><div>" + casesRoles("nouv", []) + "</div>" +
      "<div style='margin-top:10px;'><button id='btnAjouterEmploye' class='principal'>" + t("btnCreerCompteEmploye") + "</button></div>";

    Array.prototype.forEach.call(zone.querySelectorAll("[data-emp-sauver]"), (btn) => {
      btn.onclick = async () => {
        const empId = btn.dataset.empSauver;
        const nom = zone.querySelector("[data-emp='" + empId + "'][data-champ='nom']").value.trim();
        const rolesChoisis = rolesCoches(empId);
        if (!nom) { alert(t("alertNomVide")); return; }
        if (!rolesChoisis.length) { alert(t("alertAuMoinsUnAcces")); return; }
        try {
          await api("/api/" + marchandActif.id + "/employes/" + empId, { method: "PUT", body: JSON.stringify({ nom, roles: rolesChoisis }) });
          renderEmployes();
        } catch (e) { alert(t("erreurPrefixe") + e.message); }
      };
    });
    Array.prototype.forEach.call(zone.querySelectorAll("[data-emp-mdp]"), (btn) => {
      btn.onclick = async () => {
        if (!confirm(t("confirmGenererMdpEmploye"))) return;
        try {
          const rep = await api("/api/" + marchandActif.id + "/employes/" + btn.dataset.empMdp, { method: "PUT", body: JSON.stringify({ genererMotDePasse: true }) });
          alert(t("alertNouveauMdpGenereEmploye", { mdp: rep.nouveauMotDePasse }));
        } catch (e) { alert(t("erreurPrefixe") + e.message); }
      };
    });
    Array.prototype.forEach.call(zone.querySelectorAll("[data-emp-suppr]"), (btn) => {
      btn.onclick = async () => {
        if (!confirm(t("confirmSupprimerEmploye"))) return;
        try {
          await api("/api/" + marchandActif.id + "/employes/" + btn.dataset.empSuppr, { method: "DELETE" });
          renderEmployes();
        } catch (e) { alert(t("erreurPrefixe") + e.message); }
      };
    });
    document.getElementById("btnAjouterEmploye").onclick = async () => {
      const nom = document.getElementById("nouvEmpNom").value.trim();
      const identifiant = document.getElementById("nouvEmpIdentifiant").value.trim();
      const motDePasse = document.getElementById("nouvEmpMdp").value;
      const rolesChoisis = rolesCoches("nouv");
      if (!nom || !identifiant || !motDePasse) { alert(t("alertChampsRequisEmploye")); return; }
      if (motDePasse.length < 6) { alert(t("alertMdp6Caracteres")); return; }
      if (!rolesChoisis.length) { alert(t("alertAuMoinsUnAcces")); return; }
      try {
        await api("/api/" + marchandActif.id + "/employes", { method: "POST", body: JSON.stringify({ nom, identifiant, motDePasse, roles: rolesChoisis }) });
        alert(t("alertCompteEmployeCree", { id: identifiant, mdp: motDePasse }));
        renderEmployes();
      } catch (e) { alert(t("erreurPrefixe") + e.message); }
    };
  }
  redraw();
}

demarrer();
</script>
